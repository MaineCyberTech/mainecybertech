name: Dependency Re-scan

# SBOM-P2-012: advisories published while the dependency tree is unchanged are
# invisible to the PR/deploy gates, because the audit only runs when a PR or a
# deploy happens. This weekly re-scan runs the SAME policy gate in report-only
# mode (`--report` never fails) plus a Trivy filesystem scan, and uploads both
# reports as artifacts. It is deliberately non-blocking: it exists to surface
# newly published advisories, not to gate merges or deploys. Triage follows
# docs/DEPENDENCY_POLICY.md > Update governance.
#
# NOTE: schedules only fire from the default branch, so this file must be on
# `main` for the cron to fire there.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC (after the 05:00 SBOM run).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-rescan
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/setup-pnpm
        with:
          # The audit runs against the resolved tree.
          install: "true"

      - name: Re-run the dependency policy gate (report-only)
        # `--report` never fails, so a newly published advisory cannot break
        # the scheduled run; the report is the deliverable. This is the same
        # gate test.yml / validate.yml enforce.
        shell: bash
        run: |
          set -o pipefail
          node scripts/audit-gate.mjs --report 2>&1 | tee dependency-rescan.txt
          {
            echo "## Dependency re-scan (report-only)"
            echo
            echo '```'
            cat dependency-rescan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trivy filesystem scan (report-only)
        # Second opinion over the lockfile/manifests. exit-code 0 keeps the
        # run non-blocking; findings are reported in the SARIF artifact.
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-rescan.sarif
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          skip-dirs: node_modules,.pnpm-store,dist,.next,coverage,prompts,apps/web/.next
          skip-files: package-lock.json,yarn.lock

      - name: Upload re-scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-rescan
          path: |
            dependency-rescan.txt
            trivy-rescan.sarif
          retention-days: 30
