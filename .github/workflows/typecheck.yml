name: TypeCheck

# PR-only by design: on pushes to develop/main typecheck runs once through
# `deploy-do` → `validate.yml`. The push trigger here duplicated it.
on:
  workflow_dispatch:
  # Deliberately no `paths:` on pull_request (BP-P2-004): `typecheck` is a
  # required check, and a path-filtered workflow never reports on docs-only
  # PRs — leaving them blocked or unguarded.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref (rapid pushes to a PR).
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup-pnpm

      - name: TypeCheck workspace
        run: pnpm typecheck
