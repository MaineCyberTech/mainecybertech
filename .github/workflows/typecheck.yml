name: TypeCheck

# PR-only by design: on pushes to develop/main typecheck runs once through
# `deploy-do` → `validate.yml`. The push trigger here duplicated it.
on:
  workflow_dispatch:
  # Deliberately no `paths:` on pull_request (BP-P2-004): `typecheck` is a
  # required check, and a path-filtered workflow never reports on docs-only
  # PRs — leaving them blocked or unguarded.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref (rapid pushes to a PR).
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack fetches pnpm from the npm registry; retry transient failures.
          ok=""
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10 --activate; then ok=1; break; fi
            echo "corepack prepare failed (attempt $attempt/3)" >&2
            sleep 10
          done
          test -n "$ok"

      - name: Cache pnpm store
        # Content-addressed store; restore-keys give partial reuse when the
        # lockfile changes. Do NOT use setup-node's `cache: pnpm` — it resolves
        # pnpm before corepack installs it (see AGENTS.md).
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck workspace
        run: pnpm typecheck
