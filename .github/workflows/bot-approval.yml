name: bot-approval

# Human-triggered approval. The implementation lives in the reusable
# MaineCyberTech/ai-reviewer repository; this file is only the caller.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  approve:
    uses: MaineCyberTech/ai-reviewer/.github/workflows/bot-approval.yml@02fc7613f5f08bea2619ef54a35cfd6e25349b5a
