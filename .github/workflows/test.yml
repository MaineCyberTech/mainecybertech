name: Test

# PR-only by design: on pushes to develop/main the same suites run once through
# `deploy-do` → `validate.yml`. Keeping a push trigger here ran the full test
# job, audit and secret scan a second time on every push. Dependency-only
# pushes are still covered because deploy-do triggers on
# pnpm-lock.yaml/package.json.
on:
  workflow_dispatch:
  # Deliberately no `paths:` on pull_request (BP-P2-004): `test (20.x)` is a
  # required check, and a path-filtered workflow never reports on docs-only
  # PRs — leaving them blocked or unguarded.
  pull_request:
    branches: [main, develop]

# CI-P3-006: no `security-events: write` here — nothing uploads SARIF from this
# workflow (Trivy results are uploaded as artifacts, and CodeQL owns code
# scanning). The scope is granted only in codeql.yml, which uploads results.
permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref (rapid pushes to a PR). A manual
  # dispatch runs in its own ref group, so it is never cancelled by a PR.
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Shared with validate.yml so the two definitions cannot drift apart.
      - uses: ./.github/actions/unit-tests
        with:
          node-version: ${{ matrix.node-version }}
          # Optional: resolves CODEOWNERS team handles via the API (BP-P3-005).
          # Without the secret the guard runs its syntax-only fallback.
          codeowners-token: ${{ secrets.CODEOWNERS_READ_TOKEN }}

      # IR-P2-010 / OBS-P2-012: promtool check rules + rule unit tests against
      # the digest-pinned prom/prometheus image (fast, no credentials).
      # Deliberately in the required `test` job so a broken/unreachable rule
      # blocks the PR without needing a new required-check context.
      - uses: ./.github/actions/prometheus-rules

      # INFRA-P2-006: shellcheck the incident-path scripts (deploy/backup/
      # rollback). Shared with validate.yml's audit job.
      - uses: ./.github/actions/shellcheck

      # CTR-P3-008: hadolint over the app Dockerfiles, against the digest-pinned
      # image. Shared with validate.yml's audit job.
      - uses: ./.github/actions/dockerfile-lint

      # DR-P3-005 / IR-P3-001: exercise the terraform state-restore procedure
      # against a stubbed aws CLI. Shared with validate.yml's audit job.
      - uses: ./.github/actions/terraform-state-restore-test

  # Dependency audit — hard gate, no continue-on-error
  security-scan:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Shared with validate.yml's audit job.
      - uses: ./.github/actions/dependency-audit

  # Secret scanning — same patterns as the pre-commit hook (scripts/scan-secrets.sh)
  secrets-scan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # Shared with validate.yml's secrets-scan job.
      - uses: ./.github/actions/secret-scan
