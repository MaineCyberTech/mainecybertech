name: deploy-do

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      rollback_sha:
        description: "Rollback to this SHA (leave empty for normal deploy)"
        type: string
        required: false
        default: ""
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "infra/digitalocean/**"
      # Dependency changes alter the images and must still deploy — and since
      # test.yml/lint.yml/typecheck.yml are PR-only, this trigger is also what
      # keeps lockfile-only pushes covered by validate.yml.
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-do.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: write

env:
  IMAGE_TAG: ${{ github.event.inputs.rollback_sha || github.sha }}

concurrency:
  group: deploy-do-${{ github.ref }}
  # Queue deploys instead of cancelling an in-flight deploy (never abort a prod deploy mid-flight)
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.env.outputs.name }}
      app_domain: ${{ steps.env.outputs.app_domain }}
      api_domain: ${{ steps.env.outputs.api_domain }}
      www_domain: ${{ steps.env.outputs.www_domain }}
      deploy_host: ${{ steps.env.outputs.deploy_host }}
      cors_origin: ${{ steps.env.outputs.cors_origin }}
      ghcr_prefix: ${{ steps.env.outputs.ghcr_prefix }}
      droplet_name: ${{ steps.env.outputs.droplet_name }}
      test_accounts_enabled: ${{ steps.env.outputs.test_accounts_enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate rollback SHA
        if: github.event.inputs.rollback_sha != ''
        run: |
          # The value is used unquoted in a remote root shell; only allow hex.
          if ! printf '%s' "${{ github.event.inputs.rollback_sha }}" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::rollback_sha must be 7-40 lowercase hex characters"
            exit 1
          fi
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event.inputs.deploy_target }}" = "prod" ]; then
            APP_DOMAIN=app.mainecybertech.com
            API_DOMAIN=api.mainecybertech.com
            WWW_DOMAIN=www.mainecybertech.com
            ENV_NAME=prod
            DROPLET_NAME=mct-portal-prod
          else
            APP_DOMAIN=app.mainecybertech.us
            API_DOMAIN=api.mainecybertech.us
            WWW_DOMAIN=www.mainecybertech.us
            ENV_NAME=dev
            DROPLET_NAME=mct-portal-dev
          fi
          # Test accounts page is enabled on dev only
          if [ "$ENV_NAME" = "dev" ]; then
            TEST_ACCOUNTS_ENABLED=true
          else
            TEST_ACCOUNTS_ENABLED=false
          fi
          echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "app_domain=$APP_DOMAIN" >> $GITHUB_OUTPUT
          echo "api_domain=$API_DOMAIN" >> $GITHUB_OUTPUT
          echo "www_domain=$WWW_DOMAIN" >> $GITHUB_OUTPUT
          echo "deploy_host=$DROPLET_NAME" >> $GITHUB_OUTPUT
          echo "cors_origin=https://$APP_DOMAIN,https://$WWW_DOMAIN" >> $GITHUB_OUTPUT
          echo "ghcr_prefix=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "droplet_name=$DROPLET_NAME" >> $GITHUB_OUTPUT
          echo "test_accounts_enabled=$TEST_ACCOUNTS_ENABLED" >> $GITHUB_OUTPUT

  resolve-ip:
    # Resolve the droplet IP from Terraform state (single source of truth),
    # instead of querying the DigitalOcean API directly. The per-environment
    # backend config (env/backend.<env>.hcl) isolates dev/prod state in
    # separate Spaces buckets/keys so a prod apply can never clobber dev.
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.setup.outputs.name }}
    outputs:
      droplet_ip: ${{ steps.tf.outputs.droplet_ip }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.9
      - name: Resolve droplet IP (DO API, fallback Terraform state)
        id: tf
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          # Optional escape hatch: an environment variable (dev/prod) holding
          # the droplet's IPv4. Used only when the DO API and Terraform both
          # fail to yield a valid address.
          DROPLET_IP_VAR: ${{ vars.DROPLET_IP }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        working-directory: infra/terraform/digitalocean
        run: |
          set -e
          ENV="${{ needs.setup.outputs.name }}"
          DROPLET_NAME="mct-portal-$ENV"
          IP=""
          is_ipv4() { [[ "$1" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; }

          if [ -n "$DO_API_TOKEN" ]; then
            # Authoritative: the DO API returns the droplet's CURRENT IP.
            # Match exact name or a suffixed variant (recycled/recreated
            # droplets), take the newest, and pick the public IPv4.
            echo "Resolving droplet IP from DigitalOcean API ($ENV)..."
            response=$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $DO_API_TOKEN" \
              "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" || true)
            status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            echo "DO API HTTP status: $status"
            if [ "$status" = "200" ]; then
              IP=$(printf '%s' "$body" | jq -r --arg name "$DROPLET_NAME" \
                '[.droplets[] | select(.name == $name or (.name | startswith($name + "-")))]
                 | sort_by(.created_at) | last
                 | (.networks.v4[]? | select(.type == "public") | .ip_address) // empty' \
                2>/dev/null | head -n1 || true)
            else
              echo "DO API did not return 200 (token may be invalid/expired)."
            fi
          else
            echo "DO_API_TOKEN is not set; skipping the DO API."
          fi

          if ! is_ipv4 "$IP"; then
            echo "DO API did not yield a valid IPv4; trying Terraform state ($ENV)..."
            IP=""
            terraform init -input=false -backend-config=env/backend.$ENV.hcl >/dev/null 2>&1 \
              || echo "terraform init failed (non-fatal)"
            # Extract only an IPv4 from the output: the hashicorp/setup-terraform
            # wrapper emits ::error:: noise on failure that must never be parsed
            # as an address (that produced a malformed empty droplet_ip output).
            IP=$(terraform output -raw droplet_ip 2>/dev/null \
              | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1 || true)
          fi

          if ! is_ipv4 "$IP" && is_ipv4 "$DROPLET_IP_VAR"; then
            echo "Falling back to the DROPLET_IP environment variable."
            IP="$DROPLET_IP_VAR"
          fi

          if ! is_ipv4 "$IP"; then
            echo "ERROR: could not resolve a valid droplet IPv4 for $ENV"
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

  build-api:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-api image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001): the fs scan cannot see base-image OS
        # packages or npm-in-image contents.
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Attest mct-api provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

  build-worker:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-worker image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Attest mct-worker provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true

  build-web:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ needs.setup.outputs.api_domain }}
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pusher.date || '' }}
            NEXT_PUBLIC_TEST_ACCOUNTS_ENABLED=${{ needs.setup.outputs.test_accounts_enabled }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-web image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Attest mct-web provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true

  # ===== Deployment gates =====
  # verify-attestations: proves each image that deploy is about to pull was
  # built by THIS repository's Actions workflows (CTR-P1-003). Previously the
  # provenance attestation was only produced, never checked: a substituted or
  # tampered GHCR image would be pulled by tag and run with no verification.
  # This job resolves the pushed tag to its immutable digest and runs
  # `gh attestation verify`, the standard supported check for OCI images.
  # deploy `needs:` this job, so any failure here blocks the deploy cleanly
  # and shows up as its own node in the workflow graph.
  verify-attestations:
    needs: [setup, build-api, build-worker, build-web]
    # Runs for normal deploys (after the builds) AND for rollback dispatches.
    # always(): evaluate even when a sibling build was legitimately skipped.
    # !failure() && !cancelled(): never verify after a failed build.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      id-token: write
      # `gh attestation verify` reads the attestation bundle through the
      # GitHub API; without this the token has no attestations scope (a
      # job-level permissions block resets every unlisted scope to none).
      attestations: read
    steps:
      - name: Log in to GHCR
        # Verification requires registry auth: gh attestation verify reads the
        # attestation bundle from the OCI referrers API for the image, and the
        # preceding `docker buildx imagetools inspect` resolves the tag against
        # GHCR. Only `packages: read` is needed here (no write).
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        # `docker buildx imagetools inspect` resolves the pushed tag to the
        # immutable digest the attestation is bound to.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify build provenance for each image (fail closed)
        env:
          # gh needs a token for the attestation API; without it the CLI exits
          # 4 with "set the GH_TOKEN environment variable" before verifying
          # anything (the first post-merge deploy failed exactly this way).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Non-secret: the tag (commit SHA) and repository slug. Passed via env
          # so the shell blocks below are not built from interpolated input.
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_PREFIX: ${{ needs.setup.outputs.ghcr_prefix }}
          REPO_SLUG: ${{ github.repository }}
          # Rollback dispatch context: if set, this run deploys an older image
          # that may predate the attestation step entirely.
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
        run: |
          set -euo pipefail
          if [ -n "${ROLLBACK_SHA:-}" ]; then
            # ------------------------------------------------------------------
            # ROLLBACK PATH (fail closed, with an explicit allow-list)
            # ------------------------------------------------------------------
            # A rollback deploys an image built by a PAST run. Images built
            # before CTR-P1-003 have no attestation.
            #
            # An earlier revision of this step tried to "verify when an
            # attestation exists, tolerate its absence". That is NOT
            # implementable: `gh attestation verify` signals every failure mode
            # - absent, malformed, wrong repo, wrong signer workflow, digest
            # mismatch - with the same non-zero exit status, so the shell cannot
            # tell "missing" from "invalid". Putting the command in an `if`
            # therefore also disabled `set -e` for it and let a FORGED or
            # wrong-workflow attestation through, which is the opposite of the
            # stated intent.
            #
            # Instead: a rollback image must EITHER verify normally, OR its
            # digest must be listed in the explicit legacy allow-list below and
            # recorded in the job summary. A bad attestation always fails,
            # because verification is never bypassed - it is either satisfied or
            # the image is a named, reviewed exception.
            #
            # To authorise a legacy rollback, add the image digest (sha256:...)
            # to the matching list here in a reviewed PR. Do NOT add a digest
            # whose attestation merely failed to verify.
            LEGACY_MCT_API=""
            LEGACY_MCT_WORKER=""
            LEGACY_MCT_WEB=""
            echo "::warning::Rollback deploy of $ROLLBACK_SHA. Images without a valid attestation must be allow-listed (LEGACY_MCT_*)."
            for img in mct-api mct-worker mct-web; do
              REF="${GHCR_PREFIX}/${img}:${IMAGE_TAG}"
              DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
              if [ -z "$DIGEST" ]; then
                echo "::error::Could not resolve a digest for $REF"
                exit 1
              fi
              echo "Resolved $REF -> $DIGEST"
              case "$img" in
                mct-api)    ALLOW="$LEGACY_MCT_API" ;;
                mct-worker) ALLOW="$LEGACY_MCT_WORKER" ;;
                mct-web)    ALLOW="$LEGACY_MCT_WEB" ;;
              esac
              if [ -n "$ALLOW" ] && [ "$ALLOW" = "$DIGEST" ]; then
                echo "::warning::Legacy rollback image allow-listed (no attestation expected): $img@$DIGEST"
                echo "### Legacy rollback (allow-listed, unverified): $img@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              # Fail closed. `set -e` applies: a non-zero verify aborts the job.
              gh attestation verify "oci://${GHCR_PREFIX}/${img}@${DIGEST}" \
                --repo "$REPO_SLUG" \
                --signer-workflow "$REPO_SLUG/.github/workflows/deploy-do.yml" \
                --source-digest "$IMAGE_TAG"
              echo "Attestation VERIFIED for ${img}@${DIGEST}"
            done
          else
            # ------------------------------------------------------------------
            # NORMAL DEPLOY (fail closed)
            # ------------------------------------------------------------------
            # No rollback input: this is a fresh build from THIS run, which
            # always attests. Any missing/invalid/unverifiable attestation is a
            # hard failure and blocks the deploy. `set -e` means a non-zero
            # `gh attestation verify` aborts the job.
            for img in mct-api mct-worker mct-web; do
              REF="${GHCR_PREFIX}/${img}:${IMAGE_TAG}"
              DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
              if [ -z "$DIGEST" ]; then
                echo "::error::Could not resolve a digest for $REF"
                exit 1
              fi
              echo "Resolved $REF -> $DIGEST"
              gh attestation verify "oci://${GHCR_PREFIX}/${img}@${DIGEST}" \
                --repo "$REPO_SLUG" \
                --signer-workflow "$REPO_SLUG/.github/workflows/deploy-do.yml" \
                --source-digest "$IMAGE_TAG"
              echo "Attestation VERIFIED for ${img}@${DIGEST}"
            done
          fi

  # validate: always runs (test + lint + typecheck) for every deploy
  validate:
    needs: [setup]
    uses: ./.github/workflows/validate.yml

  # e2e + migrations: required for prod (main) deploys only; skipped on dev to keep deploys fast.
  # Skipped jobs do NOT block deploy -- deploy uses always() && !failure() && !cancelled().
  e2e-gate:
    needs: [setup]
    if: ${{ needs.setup.outputs.name == 'prod' && (github.event_name == 'push' || github.event.inputs.rollback_sha == '') }}
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  migrate-gate:
    needs: [setup]
    if: ${{ needs.setup.outputs.name == 'prod' && (github.event_name == 'push' || github.event.inputs.rollback_sha == '') }}
    uses: ./.github/workflows/supabase-migrations.yml
    secrets: inherit

  deploy:
    needs: [setup, resolve-ip, validate, e2e-gate, migrate-gate, build-api, build-worker, build-web, verify-attestations]
    # always(): run even when gates are skipped (dev); !failure() && !cancelled(): never run after a failure.
    # A failed verify-attestations is a failure(), so the deploy is blocked.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prod deploys use the same protected environment as the Terraform prod
    # apply (`terraform-do.yml` uses `prod-approval`) so a single required-reviewer
    # gate covers both app and infra changes. The approval itself is a GitHub
    # repository setting (Settings -> Environments -> prod-approval -> Required
    # reviewers) and cannot be enforced from this file. Dev keeps the plain `dev`
    # environment (no approval).
    environment: ${{ needs.setup.outputs.name == 'prod' && 'prod-approval' || 'dev' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JSM_BASE_URL: ${{ secrets.JSM_BASE_URL }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_CLIENT_STATE: ${{ secrets.M365_CLIENT_STATE }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
          JSM_WEBHOOK_SECRET: ${{ secrets.JSM_WEBHOOK_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          MFA_ENFORCEMENT_ENABLED: ${{ secrets.MFA_ENFORCEMENT_ENABLED }}
          PUBLIC_TRAFFIC_WEBHOOK_URL: ${{ secrets.PUBLIC_TRAFFIC_WEBHOOK_URL }}
          PUBLIC_LEAD_WEBHOOK_URL: ${{ secrets.PUBLIC_LEAD_WEBHOOK_URL }}
          JSM_DOMAIN: ${{ secrets.JSM_DOMAIN }}
          JSM_EMAIL: ${{ secrets.JSM_EMAIL }}
          JSM_API_TOKEN: ${{ secrets.JSM_API_TOKEN }}
          JSM_SERVICEDESK_ID: ${{ secrets.JSM_SERVICEDESK_ID }}
          JSM_REQUEST_TYPE_ID: ${{ secrets.JSM_REQUEST_TYPE_ID }}
          APP_DOMAIN: ${{ needs.setup.outputs.app_domain }}
          API_DOMAIN: ${{ needs.setup.outputs.api_domain }}
          CORS_ORIGIN: ${{ needs.setup.outputs.cors_origin }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RLS_READS_ENABLED: ${{ secrets.RLS_READS_ENABLED }}
          RLS_WRITES_ENABLED: ${{ secrets.RLS_WRITES_ENABLED }}
          # IR-P0-003 alerting path. These are the same variable names the
          # alertmanager service in docker-compose.yml expects; without them it
          # silently falls back to a no-op loopback URL and the dead-man's switch
          # never reaches an external service. Forwarded as env vars (not
          # interpolated into the script) like every other secret above.
          ALERTMANAGER_WATCHDOG_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_WATCHDOG_WEBHOOK_URL }}
          ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_CRITICAL_WEBHOOK_URL }}
          ALERTMANAGER_DEFAULT_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_DEFAULT_WEBHOOK_URL }}
          ALERTMANAGER_SLACK_API_URL: ${{ secrets.ALERTMANAGER_SLACK_API_URL }}
          # Channel name is non-secret config, so it comes from repository vars.
          ALERTMANAGER_SLACK_CHANNEL: ${{ vars.ALERTMANAGER_SLACK_CHANNEL }}
          # Forwarded so the remote script never interpolates these into the
          # command text (a branch name may contain shell metacharacters).
          DEPLOY_REF: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ needs.resolve-ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          command_timeout: 45m
          # Secrets are forwarded as environment variables rather than being
          # interpolated into the remote script, so a value containing $,
          # backticks or quotes cannot execute on the droplet.
          envs: "SUPABASE_URL,JWT_SECRET,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SENTRY_DSN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,EMAIL_FROM,JIRA_BASE_URL,JIRA_EMAIL,JIRA_API_TOKEN,JSM_BASE_URL,M365_TENANT_ID,M365_CLIENT_ID,M365_CLIENT_SECRET,M365_CLIENT_STATE,JIRA_WEBHOOK_SECRET,JSM_WEBHOOK_SECRET,METRICS_TOKEN,MFA_ENFORCEMENT_ENABLED,PUBLIC_TRAFFIC_WEBHOOK_URL,PUBLIC_LEAD_WEBHOOK_URL,JSM_DOMAIN,JSM_EMAIL,JSM_API_TOKEN,JSM_SERVICEDESK_ID,JSM_REQUEST_TYPE_ID,APP_DOMAIN,API_DOMAIN,CORS_ORIGIN,REDIS_PASSWORD,FIELD_ENCRYPTION_KEY,TURNSTILE_SECRET_KEY,RLS_READS_ENABLED,RLS_WRITES_ENABLED,ALERTMANAGER_WATCHDOG_WEBHOOK_URL,ALERTMANAGER_CRITICAL_WEBHOOK_URL,ALERTMANAGER_DEFAULT_WEBHOOK_URL,ALERTMANAGER_SLACK_API_URL,ALERTMANAGER_SLACK_CHANNEL,DEPLOY_REF,REPO_SLUG,GHCR_TOKEN,GHCR_ACTOR"
          script: |
            set -e
            timeout 60 cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            if ! git --version >/dev/null 2>&1; then
              apt-get install -y -qq git
            fi
            if [ ! -d "/opt/mct-portal/repo" ] || [ ! -d "/opt/mct-portal/repo/.git" ]; then
              rm -rf /opt/mct-portal/repo
              git clone "https://github.com/$REPO_SLUG.git" /opt/mct-portal/repo
            fi
            cd /opt/mct-portal/repo
            git fetch origin "$DEPLOY_REF"
            git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"
            mkdir -p /opt/mct-portal
            : > /opt/mct-portal/.env
            # printf '%s' does not re-expand values, so shell metacharacters in
            # a secret are written literally.
            {
              printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
              printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
              printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
              printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
              printf 'JIRA_BASE_URL=%s\n' "$JIRA_BASE_URL"
              printf 'JIRA_EMAIL=%s\n' "$JIRA_EMAIL"
              printf 'JIRA_API_TOKEN=%s\n' "$JIRA_API_TOKEN"
              printf 'JSM_BASE_URL=%s\n' "$JSM_BASE_URL"
              printf 'M365_TENANT_ID=%s\n' "$M365_TENANT_ID"
              printf 'M365_CLIENT_ID=%s\n' "$M365_CLIENT_ID"
              printf 'M365_CLIENT_SECRET=%s\n' "$M365_CLIENT_SECRET"
              printf 'M365_CLIENT_STATE=%s\n' "$M365_CLIENT_STATE"
              printf 'JIRA_WEBHOOK_SECRET=%s\n' "$JIRA_WEBHOOK_SECRET"
              printf 'JSM_WEBHOOK_SECRET=%s\n' "$JSM_WEBHOOK_SECRET"
              printf 'METRICS_TOKEN=%s\n' "$METRICS_TOKEN"
              printf 'MFA_ENFORCEMENT_ENABLED=%s\n' "${MFA_ENFORCEMENT_ENABLED:-false}"
              printf 'PUBLIC_TRAFFIC_WEBHOOK_URL=%s\n' "$PUBLIC_TRAFFIC_WEBHOOK_URL"
              printf 'PUBLIC_LEAD_WEBHOOK_URL=%s\n' "$PUBLIC_LEAD_WEBHOOK_URL"
              printf 'JSM_DOMAIN=%s\n' "$JSM_DOMAIN"
              printf 'JSM_EMAIL=%s\n' "$JSM_EMAIL"
              printf 'JSM_API_TOKEN=%s\n' "$JSM_API_TOKEN"
              printf 'JSM_SERVICEDESK_ID=%s\n' "$JSM_SERVICEDESK_ID"
              printf 'JSM_REQUEST_TYPE_ID=%s\n' "$JSM_REQUEST_TYPE_ID"
              printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
              printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
              printf 'CORS_ORIGIN=%s\n' "$CORS_ORIGIN"
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
              printf 'FIELD_ENCRYPTION_KEY=%s\n' "$FIELD_ENCRYPTION_KEY"
              printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
              printf 'RLS_READS_ENABLED=%s\n' "$RLS_READS_ENABLED"
              printf 'RLS_WRITES_ENABLED=%s\n' "$RLS_WRITES_ENABLED"
              printf 'ALERTMANAGER_WATCHDOG_WEBHOOK_URL=%s\n' "$ALERTMANAGER_WATCHDOG_WEBHOOK_URL"
              printf 'ALERTMANAGER_CRITICAL_WEBHOOK_URL=%s\n' "$ALERTMANAGER_CRITICAL_WEBHOOK_URL"
              printf 'ALERTMANAGER_DEFAULT_WEBHOOK_URL=%s\n' "$ALERTMANAGER_DEFAULT_WEBHOOK_URL"
              printf 'ALERTMANAGER_SLACK_API_URL=%s\n' "$ALERTMANAGER_SLACK_API_URL"
              printf 'ALERTMANAGER_SLACK_CHANNEL=%s\n' "$ALERTMANAGER_SLACK_CHANNEL"
            } >> /opt/mct-portal/.env
            chmod 600 /opt/mct-portal/.env
            # IR-P0-003 fail-closed guard: the whole point of the dead-man's
            # switch is that a silent failure of the monitoring path must be
            # detectable. Compose would happily fall back to a no-op loopback URL
            # (http://127.0.0.1:1/noop) and the deploy would look green while
            # NOTHING could ever page us off-box. A missing watchdog URL in
            # PRODUCTION is a configuration error, not an optional feature, so
            # fail the deploy rather than ship an unmonitored production stack.
            # Dev warns instead, so iteration is not blocked on provisioning an
            # external heartbeat. (Critical/default/Slack receivers stay optional
            # everywhere: their absence is visible inside Alertmanager, and the
            # watchdog still routes.)
            if [ -z "${ALERTMANAGER_WATCHDOG_WEBHOOK_URL:-}" ]; then
              if [ "${{ needs.setup.outputs.name }}" = "prod" ]; then
                echo "ERROR: ALERTMANAGER_WATCHDOG_WEBHOOK_URL is empty." >&2
                echo "IR-P0-003 requires an EXTERNAL dead-man's-switch URL (not on this droplet)." >&2
                echo "Set the repository/environment secret and re-run the deploy." >&2
                exit 1
              fi
              echo "WARNING: ALERTMANAGER_WATCHDOG_WEBHOOK_URL is empty in the '${{ needs.setup.outputs.name }}' environment — no off-box dead-man's switch. Production deploys will fail until it is set." >&2
            fi
            if [ -z "${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-}" ]; then
              echo "WARNING: ALERTMANAGER_CRITICAL_WEBHOOK_URL is empty — critical alerts have no delivery path." >&2
            fi
            echo "Droplet ready"

      - name: Deploy containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ needs.resolve-ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          command_timeout: 45m
          envs: CF_ORIGIN_CERT,CF_ORIGIN_KEY,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            mkdir -p /opt/mct-portal/certs
            printf '%s\n' "$CF_ORIGIN_CERT" > /opt/mct-portal/certs/fullchain.pem
            printf '%s\n' "$CF_ORIGIN_KEY" > /opt/mct-portal/certs/privkey.pem
            chmod 600 /opt/mct-portal/certs/privkey.pem
            # NOTE: no `docker image prune` here — old mct-* images are still in
            # use until compose down/up, so pruning pre-pull would remove nothing.
            # Retry pulls — the droplet's connection to GHCR can reset mid-pull.
            pull_retry() {
              local img="$1" attempt=1
              until docker pull "$img"; do
                if [ "$attempt" -ge 3 ]; then
                  echo "ERROR: failed to pull $img after 3 attempts" >&2
                  return 1
                fi
                echo "WARNING: pull of $img failed (attempt $attempt/3) — retrying in 10s"
                attempt=$((attempt + 1))
                sleep 10
              done
            }
            pull_retry ${{ needs.setup.outputs.ghcr_prefix }}/mct-api:${{ env.IMAGE_TAG }}
            pull_retry ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker:${{ env.IMAGE_TAG }}
            pull_retry ${{ needs.setup.outputs.ghcr_prefix }}/mct-web:${{ env.IMAGE_TAG }}
            CADDYFILE="infra/digitalocean/Caddyfile.${{ needs.setup.outputs.name }}"
            [ -f "/opt/mct-portal/repo/$CADDYFILE" ] || CADDYFILE="infra/digitalocean/Caddyfile"
            if [ -s "/opt/mct-portal/certs/fullchain.pem" ] && [ -s "/opt/mct-portal/certs/privkey.pem" ]; then
              cp /opt/mct-portal/repo/$CADDYFILE /opt/mct-portal/Caddyfile
            else
              echo "WARNING: Cert files empty/missing, using tls internal fallback"
              sed 's|tls /etc/caddy/certs/fullchain.pem /etc/caddy/certs/privkey.pem|tls internal|' /opt/mct-portal/repo/$CADDYFILE > /opt/mct-portal/Caddyfile
            fi
            cp /opt/mct-portal/repo/infra/digitalocean/docker-compose.yml /opt/mct-portal/docker-compose.yml
            cp /opt/mct-portal/repo/infra/digitalocean/redis-entrypoint.sh /opt/mct-portal/redis-entrypoint.sh
            cp /opt/mct-portal/repo/infra/digitalocean/prometheus.yml /opt/mct-portal/prometheus.yml
            cp /opt/mct-portal/repo/infra/digitalocean/prometheus.rules.yml /opt/mct-portal/prometheus.rules.yml
            # IR-P0-003: the alertmanager service in docker-compose.yml mounts
            # ./alertmanager.tmpl.yml read-only. If it is not copied, compose
            # creates a directory at that path and the container fails to start
            # (or, worse, the alerting path is silently absent).
            cp /opt/mct-portal/repo/infra/digitalocean/alertmanager.tmpl.yml /opt/mct-portal/alertmanager.tmpl.yml
            cd /opt/mct-portal
            # Remember what is currently running so a failed deploy can revert.
            PREV_TAG=$(docker inspect --format '{{.Config.Image}}' mct-portal-api-1 2>/dev/null | sed 's/.*://')
            docker compose -p mct-portal down --remove-orphans || true
            docker rm -f mct-portal-caddy-1 2>/dev/null || true
            # A failed `compose up` must not leave the site down: the previous
            # stack was already stopped by the `down` above. Restore it before
            # exiting (the health-gate rollback below only covers the case
            # where `up` succeeded but containers never became healthy).
            if ! IMAGE_TAG=${{ env.IMAGE_TAG }} GHCR_IMAGE_PREFIX=${{ needs.setup.outputs.ghcr_prefix }} docker compose -p mct-portal up -d --remove-orphans; then
              echo "ERROR: docker compose up failed; restoring the previous stack" >&2
              docker compose -p mct-portal logs --tail=40 redis 2>/dev/null || true
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${{ env.IMAGE_TAG }}" ]; then
                echo "Rolling back to previously running tag $PREV_TAG" >&2
                docker compose -p mct-portal down --remove-orphans || true
                IMAGE_TAG="$PREV_TAG" GHCR_IMAGE_PREFIX=${{ needs.setup.outputs.ghcr_prefix }} docker compose -p mct-portal up -d --remove-orphans || true
              fi
              exit 1
            fi
            sleep 15
            echo "=== Docker compose ps ==="
            docker compose -p mct-portal ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}'
            echo "=== Port 443 listener ==="
            ss -tlnp 2>/dev/null | grep :443 || netstat -tlnp 2>/dev/null | grep :443 || echo "no listener"

            # Health gate: only prune the previous images once the new
            # containers report healthy, so a failed deploy can still roll
            # back. Use the containers' own healthchecks (probing the app
            # ports from the host does not work - they are not published).
            container_health() {
              docker inspect --format '{{.State.Health.Status}}' "mct-portal-$1-1" 2>/dev/null || echo "missing"
            }
            healthy=0
            for attempt in $(seq 1 18); do
              if [ "$(container_health api)" = "healthy" ] && [ "$(container_health web)" = "healthy" ] && [ "$(container_health worker)" = "healthy" ]; then
                healthy=1
                echo "Health checks passed (attempt $attempt)"
                break
              fi
              echo "Waiting for services to become healthy (attempt $attempt/18)..."
              sleep 10
            done
            if [ "$healthy" != "1" ]; then
              echo "=== Caddy logs (last 30 lines) ==="
              docker compose -p mct-portal logs --tail=30 caddy 2>/dev/null || true
              if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "${{ env.IMAGE_TAG }}" ]; then
                echo "Attempting rollback to previously running tag $PREV_TAG" >&2
                docker compose -p mct-portal down --remove-orphans || true
                IMAGE_TAG="$PREV_TAG" GHCR_IMAGE_PREFIX=${{ needs.setup.outputs.ghcr_prefix }} docker compose -p mct-portal up -d --remove-orphans || true
              fi
              echo "ERROR: health checks failed after deploy" >&2
              exit 1
            fi

            echo "=== Pruning old mct images (keep current tag) ==="
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -E "mct-(api|worker|web)" | grep -v ":${{ env.IMAGE_TAG }}$" | xargs -r docker rmi -f 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
        env:
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}

      - name: Health check
        env:
          API_DOMAIN: ${{ needs.setup.outputs.api_domain }}
          APP_DOMAIN: ${{ needs.setup.outputs.app_domain }}
          DROPLET_IP: ${{ needs.resolve-ip.outputs.droplet_ip }}
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
        run: |
          # The worker port is not published, so it must be checked over SSH.
          # Write the key so ssh can actually authenticate (without -i the
          # check silently returned 000 and was treated as non-fatal).
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH="ssh -i $KEY_FILE -o StrictHostKeyChecking=no -o ConnectTimeout=10 root@$DROPLET_IP"
          api_ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://$API_DOMAIN/health" 2>/dev/null | tr -d '\r\n' || echo "000")
            if [ "$CODE" = "200" ]; then echo "API ready after $((i*4))s (HTTP 200)"; api_ok=1; break; fi
            echo "Attempt $i/30: $CODE"; sleep 4
          done
          if [ -z "$api_ok" ]; then
            echo "===== API CONTAINER LOGS START ====="
            $SSH "docker ps -a --format '{{.Names}} {{.Status}}'; echo '---'; docker compose -p mct-portal logs --tail=50 api 2>/dev/null || docker logs mct-portal-api-1 --tail 50 2>/dev/null || echo 'no api container found'" || echo "SSH to droplet failed"
            echo "===== API CONTAINER LOGS END ====="
            rm -f "$KEY_FILE"
            exit 1
          fi
          echo "Worker health check via SSH..."
          worker_ok=""
          for i in $(seq 1 12); do
            wcode=$($SSH \
              "docker exec mct-portal-worker-1 wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 && echo 200 || echo 000" 2>/dev/null | tr -d '\r\n' || echo "000")
            if [ "$wcode" = "200" ]; then
              echo "Worker healthy after $((i*5))s (HTTP 200)"; worker_ok=1; break
            fi
            echo "Worker attempt $i/12: HTTP $wcode"; sleep 5
          done
          if [ -z "$worker_ok" ]; then
            echo "===== WORKER CONTAINER LOGS START ====="
            $SSH "docker compose -p mct-portal logs --tail=50 worker 2>/dev/null || docker logs mct-portal-worker-1 --tail 50 2>/dev/null || echo 'no worker container found'" || echo "SSH to droplet failed"
            echo "===== WORKER CONTAINER LOGS END ====="
            rm -f "$KEY_FILE"
            echo "Worker health check failed" >&2
            exit 1
          fi
          rm -f "$KEY_FILE"
          web_ok=""
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://$APP_DOMAIN/login" 2>/dev/null | tr -d '\r\n' || echo "000")
            # Only redirect + success codes are healthy (200, 301, 302, 307);
            # a 500/502/503 means the app booted but is failing.
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ] || [ "$CODE" = "307" ]; then
              echo "Web ready after $((i*4))s (HTTP $CODE)"; web_ok=1; break
            fi
            echo "Attempt $i/15: $CODE"; sleep 4
          done
          [ -z "$web_ok" ] && { echo "Web health check failed"; exit 1; }
          echo "--- ALL HEALTH CHECKS PASSED ---"
