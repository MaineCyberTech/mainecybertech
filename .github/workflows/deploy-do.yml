name: deploy-do

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev
      rollback_sha:
        description: "Rollback to this SHA (leave empty for normal deploy)"
        type: string
        required: false
        default: ""
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/worker/**"
      - "packages/**"
      - "infra/digitalocean/**"
      # Dependency changes alter the images and must still deploy — and since
      # test.yml/lint.yml/typecheck.yml are PR-only, this trigger is also what
      # keeps lockfile-only pushes covered by validate.yml.
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-do.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_TAG: ${{ github.event.inputs.rollback_sha || github.sha }}

concurrency:
  group: deploy-do-${{ github.ref }}
  # Queue deploys instead of cancelling an in-flight deploy (never abort a prod deploy mid-flight)
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.env.outputs.name }}
      app_domain: ${{ steps.env.outputs.app_domain }}
      api_domain: ${{ steps.env.outputs.api_domain }}
      www_domain: ${{ steps.env.outputs.www_domain }}
      deploy_host: ${{ steps.env.outputs.deploy_host }}
      cors_origin: ${{ steps.env.outputs.cors_origin }}
      ghcr_prefix: ${{ steps.env.outputs.ghcr_prefix }}
      droplet_name: ${{ steps.env.outputs.droplet_name }}
      test_accounts_enabled: ${{ steps.env.outputs.test_accounts_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restrict prod dispatch to the main branch
        # BP-P2-006: a manual dispatch with deploy_target=prod must come from
        # the develop -> main promotion path, not an arbitrary feature branch.
        # Push deploys to main are unaffected (they always target prod).
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'prod'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::deploy_target=prod can only be dispatched from the main branch (got ${GITHUB_REF}). Promote develop -> main first."
            exit 1
          fi
      - name: Validate rollback SHA
        if: github.event.inputs.rollback_sha != ''
        env:
          # CI-P3-013: never interpolate dispatch inputs directly into a run
          # script — pass them through env so shell metacharacters in the input
          # cannot inject commands before validation.
          ROLLBACK_SHA_INPUT: ${{ github.event.inputs.rollback_sha }}
        run: |
          # The value is used unquoted in a remote root shell; only allow hex.
          if ! printf '%s' "$ROLLBACK_SHA_INPUT" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::rollback_sha must be 7-40 lowercase hex characters"
            exit 1
          fi
      - name: Determine environment
        id: env
        env:
          # CI-P3-013: env indirection for dispatch inputs (see above).
          REF_NAME_INPUT: ${{ github.ref_name }}
          DEPLOY_TARGET_INPUT: ${{ github.event.inputs.deploy_target }}
        run: |
          if [ "$REF_NAME_INPUT" = "main" ] || [ "$DEPLOY_TARGET_INPUT" = "prod" ]; then
            APP_DOMAIN=app.mainecybertech.com
            API_DOMAIN=api.mainecybertech.com
            WWW_DOMAIN=www.mainecybertech.com
            ENV_NAME=prod
            DROPLET_NAME=mct-portal-prod
          else
            APP_DOMAIN=app.mainecybertech.us
            API_DOMAIN=api.mainecybertech.us
            WWW_DOMAIN=www.mainecybertech.us
            ENV_NAME=dev
            DROPLET_NAME=mct-portal-dev
          fi
          # Test accounts page is enabled on dev only
          if [ "$ENV_NAME" = "dev" ]; then
            TEST_ACCOUNTS_ENABLED=true
          else
            TEST_ACCOUNTS_ENABLED=false
          fi
          echo "name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "app_domain=$APP_DOMAIN" >> $GITHUB_OUTPUT
          echo "api_domain=$API_DOMAIN" >> $GITHUB_OUTPUT
          echo "www_domain=$WWW_DOMAIN" >> $GITHUB_OUTPUT
          echo "deploy_host=$DROPLET_NAME" >> $GITHUB_OUTPUT
          echo "cors_origin=https://$APP_DOMAIN,https://$WWW_DOMAIN" >> $GITHUB_OUTPUT
          echo "ghcr_prefix=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "droplet_name=$DROPLET_NAME" >> $GITHUB_OUTPUT
          echo "test_accounts_enabled=$TEST_ACCOUNTS_ENABLED" >> $GITHUB_OUTPUT

  resolve-ip:
    # Resolve the droplet IP from Terraform state (single source of truth),
    # instead of querying the DigitalOcean API directly. The per-environment
    # backend config (env/backend.<env>.hcl) isolates dev/prod state in
    # separate Spaces buckets/keys so a prod apply can never clobber dev.
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.setup.outputs.name }}
    outputs:
      droplet_ip: ${{ steps.tf.outputs.droplet_ip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9
      - name: Resolve droplet IP (DO API, fallback Terraform state)
        id: tf
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          # Optional escape hatch: an environment variable (dev/prod) holding
          # the droplet's IPv4. Used only when the DO API and Terraform both
          # fail to yield a valid address.
          DROPLET_IP_VAR: ${{ vars.DROPLET_IP }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        working-directory: infra/terraform/digitalocean
        run: |
          set -e
          ENV="${{ needs.setup.outputs.name }}"
          DROPLET_NAME="mct-portal-$ENV"
          IP=""
          is_ipv4() { [[ "$1" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; }

          if [ -n "$DO_API_TOKEN" ]; then
            # Authoritative: the DO API returns the droplet's CURRENT IP.
            # Match exact name or a suffixed variant (recycled/recreated
            # droplets), take the newest, and pick the public IPv4.
            echo "Resolving droplet IP from DigitalOcean API ($ENV)..."
            response=$(curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $DO_API_TOKEN" \
              "https://api.digitalocean.com/v2/droplets?page=1&per_page=200" || true)
            status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            echo "DO API HTTP status: $status"
            if [ "$status" = "200" ]; then
              IP=$(printf '%s' "$body" | jq -r --arg name "$DROPLET_NAME" \
                '[.droplets[] | select(.name == $name or (.name | startswith($name + "-")))]
                 | sort_by(.created_at) | last
                 | (.networks.v4[]? | select(.type == "public") | .ip_address) // empty' \
                2>/dev/null | head -n1 || true)
            else
              echo "DO API did not return 200 (token may be invalid/expired)."
            fi
          else
            echo "DO_API_TOKEN is not set; skipping the DO API."
          fi

          if ! is_ipv4 "$IP"; then
            echo "DO API did not yield a valid IPv4; trying Terraform state ($ENV)..."
            IP=""
            terraform init -input=false -backend-config=env/backend.$ENV.hcl >/dev/null 2>&1 \
              || echo "terraform init failed (non-fatal)"
            # Extract only an IPv4 from the output: the hashicorp/setup-terraform
            # wrapper emits ::error:: noise on failure that must never be parsed
            # as an address (that produced a malformed empty droplet_ip output).
            IP=$(terraform output -raw droplet_ip 2>/dev/null \
              | grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' | head -n1 || true)
          fi

          if ! is_ipv4 "$IP" && is_ipv4 "$DROPLET_IP_VAR"; then
            echo "Falling back to the DROPLET_IP environment variable."
            IP="$DROPLET_IP_VAR"
          fi

          if ! is_ipv4 "$IP"; then
            echo "ERROR: could not resolve a valid droplet IPv4 for $ENV"
            exit 1
          fi
          echo "droplet_ip=$IP" >> $GITHUB_OUTPUT
          echo "Using droplet IP: $IP"

  build-api:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-api image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001): the fs scan cannot see base-image OS
        # packages or npm-in-image contents.
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Generate mct-api image SBOM (CycloneDX)
        # SUPPLY-P3-001: emit a digest-bound SBOM on the deploy path so a shipped
        # image can always be tied to its bill of materials (the 30-day workflow
        # artifact alone expires, and build-push.yml is not on the deploy path).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api@${{ steps.build-api.outputs.digest }}
          format: cyclonedx
          output: image-sbom-mct-api.cdx.json
          scanners: vuln
      - name: Validate mct-api image SBOM (SBOM-P3-005)
        # Floor + digest-binding check before attestation: an empty or partial
        # Trivy output must never become the durable record for a digest.
        run: |
          node scripts/validate-sbom.mjs --image \
            --digest "${{ steps.build-api.outputs.digest }}" \
            image-sbom-mct-api.cdx.json
      - name: Attest mct-api SBOM (SUPPLY-P3-001)
        # Cryptographically binds the SBOM to the deployed image digest and pushes
        # it to the registry as an OCI referrer, so it is durable and not subject
        # to the 30-day artifact retention window.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          sbom-path: image-sbom-mct-api.cdx.json
          push-to-registry: true
      - name: Attest mct-api provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

  build-worker:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-worker image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Generate mct-worker image SBOM (CycloneDX)
        # SUPPLY-P3-001: digest-bound SBOM on the deploy path (see build-api).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker@${{ steps.build-worker.outputs.digest }}
          format: cyclonedx
          output: image-sbom-mct-worker.cdx.json
          scanners: vuln
      - name: Validate mct-worker image SBOM (SBOM-P3-005)
        # Floor + digest-binding check before attestation (see build-api).
        run: |
          node scripts/validate-sbom.mjs --image \
            --digest "${{ steps.build-worker.outputs.digest }}" \
            image-sbom-mct-worker.cdx.json
      - name: Attest mct-worker SBOM (SUPPLY-P3-001)
        # Durable, digest-bound SBOM attestation (see build-api).
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          sbom-path: image-sbom-mct-worker.cdx.json
          push-to-registry: true
      - name: Attest mct-worker provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-worker
          subject-digest: ${{ steps.build-worker.outputs.digest }}
          push-to-registry: true

  build-web:
    needs: [setup]
    if: ${{ github.event_name == 'push' || github.event.inputs.rollback_sha == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - id: build-web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ needs.setup.outputs.api_domain }}
            NEXT_PUBLIC_APP_VERSION=${{ github.ref_name }}-${{ github.run_number }}
            NEXT_PUBLIC_GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_TIME=${{ github.event.head_commit.timestamp || github.event.pusher.date || '' }}
            NEXT_PUBLIC_TEST_ACCOUNTS_ENABLED=${{ needs.setup.outputs.test_accounts_enabled }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
          tags: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan mct-web image (CRITICAL/HIGH)
        # Image-layer scan (CTR-P1-001).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
      - name: Generate mct-web image SBOM (CycloneDX)
        # SUPPLY-P3-001: digest-bound SBOM on the deploy path (see build-api).
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web@${{ steps.build-web.outputs.digest }}
          format: cyclonedx
          output: image-sbom-mct-web.cdx.json
          scanners: vuln
      - name: Validate mct-web image SBOM (SBOM-P3-005)
        # Floor + digest-binding check before attestation (see build-api).
        run: |
          node scripts/validate-sbom.mjs --image \
            --digest "${{ steps.build-web.outputs.digest }}" \
            image-sbom-mct-web.cdx.json
      - name: Attest mct-web SBOM (SUPPLY-P3-001)
        # Durable, digest-bound SBOM attestation (see build-api).
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web
          subject-digest: ${{ steps.build-web.outputs.digest }}
          sbom-path: image-sbom-mct-web.cdx.json
          push-to-registry: true
      - name: Attest mct-web provenance (CTR-P1-003)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ needs.setup.outputs.ghcr_prefix }}/mct-web
          subject-digest: ${{ steps.build-web.outputs.digest }}
          push-to-registry: true

  # ===== Deployment gates =====
  # verify-attestations: proves each image that deploy is about to pull was
  # built by THIS repository's Actions workflows (CTR-P1-003). Previously the
  # provenance attestation was only produced, never checked: a substituted or
  # tampered GHCR image would be pulled by tag and run with no verification.
  # This job resolves the pushed tag to its immutable digest and runs
  # `gh attestation verify`, the standard supported check for OCI images.
  # deploy `needs:` this job, so any failure here blocks the deploy cleanly
  # and shows up as its own node in the workflow graph.
  verify-attestations:
    needs: [setup, build-api, build-worker, build-web]
    # Runs for normal deploys (after the builds) AND for rollback dispatches.
    # always(): evaluate even when a sibling build was legitimately skipped.
    # !failure() && !cancelled(): never verify after a failed build.
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # SBOM-P2-011: the digests resolved and verified here are handed to the
    # deploy job, which pulls/runs exactly these digests instead of the
    # mutable tag.
    outputs:
      api_digest: ${{ steps.verify.outputs.api_digest }}
      worker_digest: ${{ steps.verify.outputs.worker_digest }}
      web_digest: ${{ steps.verify.outputs.web_digest }}
    permissions:
      contents: read
      packages: read
      id-token: write
      # `gh attestation verify` reads the attestation bundle through the
      # GitHub API; without this the token has no attestations scope (a
      # job-level permissions block resets every unlisted scope to none).
      attestations: read
    steps:
      - name: Log in to GHCR
        # Verification requires registry auth: gh attestation verify reads the
        # attestation bundle from the OCI referrers API for the image, and the
        # preceding `docker buildx imagetools inspect` resolves the tag against
        # GHCR. Only `packages: read` is needed here (no write).
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup buildx
        # `docker buildx imagetools inspect` resolves the pushed tag to the
        # immutable digest the attestation is bound to.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify build provenance + SBOM attestations for each image (fail closed)
        id: verify
        env:
          # gh needs a token for the attestation API; without it the CLI exits
          # 4 with "set the GH_TOKEN environment variable" before verifying
          # anything (the first post-merge deploy failed exactly this way).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Non-secret: the tag (commit SHA) and repository slug. Passed via env
          # so the shell blocks below are not built from interpolated input.
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_PREFIX: ${{ needs.setup.outputs.ghcr_prefix }}
          REPO_SLUG: ${{ github.repository }}
          # Rollback dispatch context: if set, this run deploys an older image
          # that may predate the attestation step entirely.
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
        run: |
          set -euo pipefail

          # SBOM-P2-011: verify BOTH predicates this pipeline attests - SLSA
          # build provenance AND the CycloneDX SBOM - and publish the resolved
          # digest as a job output. The deploy job pulls/runs exactly that
          # digest, so re-pointing the mutable tag after this check cannot
          # substitute the artifact, and the SBOM predicate can no longer be
          # absent while verification still passes. (gh defaults to the
          # provenance predicate; it is passed explicitly so the pair is
          # self-documenting.)
          verify_image() {
            local img="$1" digest="$2"
            gh attestation verify "oci://${GHCR_PREFIX}/${img}@${digest}" \
              --repo "$REPO_SLUG" \
              --signer-workflow "$REPO_SLUG/.github/workflows/deploy-do.yml" \
              --source-digest "$IMAGE_TAG" \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "oci://${GHCR_PREFIX}/${img}@${digest}" \
              --repo "$REPO_SLUG" \
              --signer-workflow "$REPO_SLUG/.github/workflows/deploy-do.yml" \
              --source-digest "$IMAGE_TAG" \
              --predicate-type https://cyclonedx.org/bom
            echo "Attestations VERIFIED (provenance + CycloneDX SBOM) for ${img}@${digest}"
          }

          publish_digest() {
            local img="$1" digest="$2"
            case "$img" in
              mct-api)    echo "api_digest=$digest" >> "$GITHUB_OUTPUT" ;;
              mct-worker) echo "worker_digest=$digest" >> "$GITHUB_OUTPUT" ;;
              mct-web)    echo "web_digest=$digest" >> "$GITHUB_OUTPUT" ;;
            esac
          }

          if [ -n "${ROLLBACK_SHA:-}" ]; then
            # ------------------------------------------------------------------
            # ROLLBACK PATH (fail closed, with an explicit allow-list)
            # ------------------------------------------------------------------
            # A rollback deploys an image built by a PAST run. Images built
            # before CTR-P1-003 have no attestation.
            #
            # An earlier revision of this step tried to "verify when an
            # attestation exists, tolerate its absence". That is NOT
            # implementable: `gh attestation verify` signals every failure mode
            # - absent, malformed, wrong repo, wrong signer workflow, digest
            # mismatch - with the same non-zero exit status, so the shell cannot
            # tell "missing" from "invalid". Putting the command in an `if`
            # therefore also disabled `set -e` for it and let a FORGED or
            # wrong-workflow attestation through, which is the opposite of the
            # stated intent.
            #
            # Instead: a rollback image must EITHER verify normally, OR its
            # digest must be listed in the explicit legacy allow-list below and
            # recorded in the job summary. A bad attestation always fails,
            # because verification is never bypassed - it is either satisfied or
            # the image is a named, reviewed exception.
            #
            # To authorise a legacy rollback, add the image digest (sha256:...)
            # to the matching list here in a reviewed PR. Do NOT add a digest
            # whose attestation merely failed to verify.
            LEGACY_MCT_API=""
            LEGACY_MCT_WORKER=""
            LEGACY_MCT_WEB=""
            echo "::warning::Rollback deploy of $ROLLBACK_SHA. Images without a valid attestation must be allow-listed (LEGACY_MCT_*)."
            for img in mct-api mct-worker mct-web; do
              REF="${GHCR_PREFIX}/${img}:${IMAGE_TAG}"
              DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
              if [ -z "$DIGEST" ]; then
                echo "::error::Could not resolve a digest for $REF"
                exit 1
              fi
              echo "Resolved $REF -> $DIGEST"
              case "$img" in
                mct-api)    ALLOW="$LEGACY_MCT_API" ;;
                mct-worker) ALLOW="$LEGACY_MCT_WORKER" ;;
                mct-web)    ALLOW="$LEGACY_MCT_WEB" ;;
              esac
              if [ -n "$ALLOW" ] && [ "$ALLOW" = "$DIGEST" ]; then
                echo "::warning::Legacy rollback image allow-listed (no attestation expected): $img@$DIGEST"
                echo "### Legacy rollback (allow-listed, unverified): $img@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
                publish_digest "$img" "$DIGEST"
                continue
              fi
              # Fail closed. `set -e` applies: a non-zero verify aborts the job.
              verify_image "$img" "$DIGEST"
              publish_digest "$img" "$DIGEST"
            done
          else
            # ------------------------------------------------------------------
            # NORMAL DEPLOY (fail closed)
            # ------------------------------------------------------------------
            # No rollback input: this is a fresh build from THIS run, which
            # always attests. Any missing/invalid/unverifiable attestation is a
            # hard failure and blocks the deploy. `set -e` means a non-zero
            # `gh attestation verify` aborts the job.
            for img in mct-api mct-worker mct-web; do
              REF="${GHCR_PREFIX}/${img}:${IMAGE_TAG}"
              DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
              if [ -z "$DIGEST" ]; then
                echo "::error::Could not resolve a digest for $REF"
                exit 1
              fi
              echo "Resolved $REF -> $DIGEST"
              verify_image "$img" "$DIGEST"
              publish_digest "$img" "$DIGEST"
            done
          fi

  # validate: always runs (test + lint + typecheck) for every deploy.
  # Reusable-workflow calls cannot declare timeout-minutes (GitHub limitation);
  # the callee's jobs carry their own timeouts (validate.yml).
  validate:
    needs: [setup]
    uses: ./.github/workflows/validate.yml

  # e2e + migrations: required for prod (main) deploys only; skipped on dev to keep deploys fast.
  # A skipped job is only tolerated because its own `if` deliberately excludes dev;
  # the deploy gate below still requires every job that ran to have succeeded.
  e2e-gate:
    needs: [setup]
    if: ${{ needs.setup.outputs.name == 'prod' && (github.event_name == 'push' || github.event.inputs.rollback_sha == '') }}
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  migrate-gate:
    needs: [setup]
    if: ${{ needs.setup.outputs.name == 'prod' && (github.event_name == 'push' || github.event.inputs.rollback_sha == '') }}
    uses: ./.github/workflows/supabase-migrations.yml
    secrets: inherit

  deploy:
    needs: [setup, resolve-ip, validate, e2e-gate, migrate-gate, build-api, build-worker, build-web, verify-attestations]
    # Fail closed. Do NOT use `always() && !failure()` here: `failure()` is false
    # when a needed job was merely *skipped*, so that pattern can let a deploy run
    # when a gate did not actually pass. Require every job that ran to have
    # succeeded explicitly:
    #   - validate (test + lint + typecheck + audit + secrets) and every build
    #     must be green;
    #   - e2e-gate / migrate-gate may be `skipped` only on dev, where their own
    #     `if` excludes them;
    #   - build-api/worker/web may be `skipped` only for a rollback dispatch
    #     (existing images are re-deployed);
    #   - verify-attestations must always succeed.
    if: >-
      ${{
        !cancelled() &&
        needs.setup.result == 'success' &&
        needs['resolve-ip'].result == 'success' &&
        needs.validate.result == 'success' &&
        needs['verify-attestations'].result == 'success' &&
        (needs['e2e-gate'].result == 'success' || needs['e2e-gate'].result == 'skipped') &&
        (needs['migrate-gate'].result == 'success' || needs['migrate-gate'].result == 'skipped') &&
        (needs['build-api'].result == 'success' || needs['build-api'].result == 'skipped') &&
        (needs['build-worker'].result == 'success' || needs['build-worker'].result == 'skipped') &&
        (needs['build-web'].result == 'success' || needs['build-web'].result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Prod deploys use the same protected environment as the Terraform prod
    # apply (`terraform-do.yml` uses `prod-approval`) so a single required-reviewer
    # gate covers both app and infra changes. The approval itself is a GitHub
    # repository setting (Settings -> Environments -> prod-approval -> Required
    # reviewers) and cannot be enforced from this file. Dev keeps the plain `dev`
    # environment (no approval).
    environment: ${{ needs.setup.outputs.name == 'prod' && 'prod-approval' || 'dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup droplet
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # OBS-P3-004: release marker for API/worker (and web server-side)
          # Sentry events. Same expression as the workflow-level IMAGE_TAG, so
          # the marker matches the image actually running (including a rollback
          # dispatch, where it is the rolled-back commit).
          SENTRY_RELEASE: ${{ github.event.inputs.rollback_sha || github.sha }}
          # OBS-P2-011: the web app reads NEXT_PUBLIC_SENTRY_DSN (the same DSN,
          # public by design), not SENTRY_DSN. Forward it for the web service
          # env; the build arg comes from the same expression in build-web.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.SENTRY_DSN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Web Push (NOTIF-P2-001). Optional: unset/empty keeps the channel
          # disabled (no-op), so a deploy without the secrets still succeeds.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JSM_BASE_URL: ${{ secrets.JSM_BASE_URL }}
          M365_TENANT_ID: ${{ secrets.M365_TENANT_ID }}
          M365_CLIENT_ID: ${{ secrets.M365_CLIENT_ID }}
          M365_CLIENT_SECRET: ${{ secrets.M365_CLIENT_SECRET }}
          M365_CLIENT_STATE: ${{ secrets.M365_CLIENT_STATE }}
          JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
          JSM_WEBHOOK_SECRET: ${{ secrets.JSM_WEBHOOK_SECRET }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          MFA_ENFORCEMENT_ENABLED: ${{ secrets.MFA_ENFORCEMENT_ENABLED }}
          PUBLIC_TRAFFIC_WEBHOOK_URL: ${{ secrets.PUBLIC_TRAFFIC_WEBHOOK_URL }}
          PUBLIC_LEAD_WEBHOOK_URL: ${{ secrets.PUBLIC_LEAD_WEBHOOK_URL }}
          JSM_DOMAIN: ${{ secrets.JSM_DOMAIN }}
          JSM_EMAIL: ${{ secrets.JSM_EMAIL }}
          JSM_API_TOKEN: ${{ secrets.JSM_API_TOKEN }}
          JSM_SERVICEDESK_ID: ${{ secrets.JSM_SERVICEDESK_ID }}
          JSM_REQUEST_TYPE_ID: ${{ secrets.JSM_REQUEST_TYPE_ID }}
          APP_DOMAIN: ${{ needs.setup.outputs.app_domain }}
          API_DOMAIN: ${{ needs.setup.outputs.api_domain }}
          CORS_ORIGIN: ${{ needs.setup.outputs.cors_origin }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          MALWARE_SCANNER_URL: ${{ secrets.MALWARE_SCANNER_URL }}
          MALWARE_SCANNER_API_KEY: ${{ secrets.MALWARE_SCANNER_API_KEY }}
          RLS_READS_ENABLED: ${{ secrets.RLS_READS_ENABLED }}
          RLS_WRITES_ENABLED: ${{ secrets.RLS_WRITES_ENABLED }}
          # IR-P0-003 alerting path. These are the same variable names the
          # alertmanager service in docker-compose.yml expects; without them it
          # silently falls back to a no-op loopback URL and the dead-man's switch
          # never reaches an external service. Forwarded as env vars (not
          # interpolated into the script) like every other secret above.
          ALERTMANAGER_WATCHDOG_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_WATCHDOG_WEBHOOK_URL }}
          ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_CRITICAL_WEBHOOK_URL }}
          ALERTMANAGER_DEFAULT_WEBHOOK_URL: ${{ secrets.ALERTMANAGER_DEFAULT_WEBHOOK_URL }}
          ALERTMANAGER_SLACK_API_URL: ${{ secrets.ALERTMANAGER_SLACK_API_URL }}
          # Channel name is non-secret config, so it comes from repository vars.
          ALERTMANAGER_SLACK_CHANNEL: ${{ vars.ALERTMANAGER_SLACK_CHANNEL }}
          # Basic auth for the critical/default webhook receivers (the ntfy
          # relay user). Required whenever those URLs point at ntfy.
          ALERTMANAGER_WEBHOOK_USER: ${{ secrets.ALERTMANAGER_WEBHOOK_USER }}
          ALERTMANAGER_WEBHOOK_PASS: ${{ secrets.ALERTMANAGER_WEBHOOK_PASS }}
          # Forwarded so the remote script never interpolates these into the
          # command text (a branch name may contain shell metacharacters).
          DEPLOY_REF: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ needs.resolve-ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          command_timeout: 45m
          # Secrets are forwarded as environment variables rather than being
          # interpolated into the remote script, so a value containing $,
          # backticks or quotes cannot execute on the droplet.
          envs: "SUPABASE_URL,JWT_SECRET,SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,SENTRY_DSN,SENTRY_RELEASE,NEXT_PUBLIC_SENTRY_DSN,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,EMAIL_FROM,VAPID_PUBLIC_KEY,VAPID_PRIVATE_KEY,VAPID_SUBJECT,JIRA_BASE_URL,JIRA_EMAIL,JIRA_API_TOKEN,JSM_BASE_URL,M365_TENANT_ID,M365_CLIENT_ID,M365_CLIENT_SECRET,M365_CLIENT_STATE,JIRA_WEBHOOK_SECRET,JSM_WEBHOOK_SECRET,METRICS_TOKEN,MFA_ENFORCEMENT_ENABLED,PUBLIC_TRAFFIC_WEBHOOK_URL,PUBLIC_LEAD_WEBHOOK_URL,JSM_DOMAIN,JSM_EMAIL,JSM_API_TOKEN,JSM_SERVICEDESK_ID,JSM_REQUEST_TYPE_ID,APP_DOMAIN,API_DOMAIN,CORS_ORIGIN,REDIS_PASSWORD,FIELD_ENCRYPTION_KEY,TURNSTILE_SECRET_KEY,MALWARE_SCANNER_URL,MALWARE_SCANNER_API_KEY,RLS_READS_ENABLED,RLS_WRITES_ENABLED,ALERTMANAGER_WATCHDOG_WEBHOOK_URL,ALERTMANAGER_CRITICAL_WEBHOOK_URL,ALERTMANAGER_DEFAULT_WEBHOOK_URL,ALERTMANAGER_SLACK_API_URL,ALERTMANAGER_SLACK_CHANNEL,ALERTMANAGER_WEBHOOK_USER,ALERTMANAGER_WEBHOOK_PASS,DEPLOY_REF,REPO_SLUG,GHCR_TOKEN,GHCR_ACTOR"
          script: |
            set -e
            timeout 60 cloud-init status --wait 2>/dev/null || true
            if ! docker compose version >/dev/null 2>&1; then
              apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq docker-compose-v2
            fi
            if ! git --version >/dev/null 2>&1; then
              apt-get install -y -qq git
            fi
            if [ ! -d "/opt/mct-portal/repo" ] || [ ! -d "/opt/mct-portal/repo/.git" ]; then
              rm -rf /opt/mct-portal/repo
              git clone "https://github.com/$REPO_SLUG.git" /opt/mct-portal/repo
            fi
            cd /opt/mct-portal/repo
            git fetch origin "$DEPLOY_REF"
            git checkout -B "$DEPLOY_REF" "origin/$DEPLOY_REF"
            git reset --hard "origin/$DEPLOY_REF"
            mkdir -p /opt/mct-portal
            : > /opt/mct-portal/.env
            # printf '%s' does not re-expand values, so shell metacharacters in
            # a secret are written literally.
            {
              printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
              printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
              printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
              printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
              printf 'SENTRY_RELEASE=%s\n' "$SENTRY_RELEASE"
              printf 'NEXT_PUBLIC_SENTRY_DSN=%s\n' "$NEXT_PUBLIC_SENTRY_DSN"
              printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
              printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
              printf 'EMAIL_FROM=%s\n' "$EMAIL_FROM"
              printf 'VAPID_PUBLIC_KEY=%s\n' "$VAPID_PUBLIC_KEY"
              printf 'VAPID_PRIVATE_KEY=%s\n' "$VAPID_PRIVATE_KEY"
              printf 'VAPID_SUBJECT=%s\n' "$VAPID_SUBJECT"
              printf 'JIRA_BASE_URL=%s\n' "$JIRA_BASE_URL"
              printf 'JIRA_EMAIL=%s\n' "$JIRA_EMAIL"
              printf 'JIRA_API_TOKEN=%s\n' "$JIRA_API_TOKEN"
              printf 'JSM_BASE_URL=%s\n' "$JSM_BASE_URL"
              printf 'M365_TENANT_ID=%s\n' "$M365_TENANT_ID"
              printf 'M365_CLIENT_ID=%s\n' "$M365_CLIENT_ID"
              printf 'M365_CLIENT_SECRET=%s\n' "$M365_CLIENT_SECRET"
              printf 'M365_CLIENT_STATE=%s\n' "$M365_CLIENT_STATE"
              printf 'JIRA_WEBHOOK_SECRET=%s\n' "$JIRA_WEBHOOK_SECRET"
              printf 'JSM_WEBHOOK_SECRET=%s\n' "$JSM_WEBHOOK_SECRET"
              printf 'METRICS_TOKEN=%s\n' "$METRICS_TOKEN"
              printf 'MFA_ENFORCEMENT_ENABLED=%s\n' "${MFA_ENFORCEMENT_ENABLED:-false}"
              printf 'PUBLIC_TRAFFIC_WEBHOOK_URL=%s\n' "$PUBLIC_TRAFFIC_WEBHOOK_URL"
              printf 'PUBLIC_LEAD_WEBHOOK_URL=%s\n' "$PUBLIC_LEAD_WEBHOOK_URL"
              printf 'JSM_DOMAIN=%s\n' "$JSM_DOMAIN"
              printf 'JSM_EMAIL=%s\n' "$JSM_EMAIL"
              printf 'JSM_API_TOKEN=%s\n' "$JSM_API_TOKEN"
              printf 'JSM_SERVICEDESK_ID=%s\n' "$JSM_SERVICEDESK_ID"
              printf 'JSM_REQUEST_TYPE_ID=%s\n' "$JSM_REQUEST_TYPE_ID"
              printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
              printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
              printf 'CORS_ORIGIN=%s\n' "$CORS_ORIGIN"
              printf 'REDIS_PASSWORD=%s\n' "$REDIS_PASSWORD"
              printf 'FIELD_ENCRYPTION_KEY=%s\n' "$FIELD_ENCRYPTION_KEY"
              printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
              printf 'MALWARE_SCANNER_URL=%s\n' "$MALWARE_SCANNER_URL"
              printf 'MALWARE_SCANNER_API_KEY=%s\n' "$MALWARE_SCANNER_API_KEY"
              printf 'RLS_READS_ENABLED=%s\n' "$RLS_READS_ENABLED"
              printf 'RLS_WRITES_ENABLED=%s\n' "$RLS_WRITES_ENABLED"
              printf 'ALERTMANAGER_WATCHDOG_WEBHOOK_URL=%s\n' "$ALERTMANAGER_WATCHDOG_WEBHOOK_URL"
              printf 'ALERTMANAGER_CRITICAL_WEBHOOK_URL=%s\n' "$ALERTMANAGER_CRITICAL_WEBHOOK_URL"
              printf 'ALERTMANAGER_DEFAULT_WEBHOOK_URL=%s\n' "$ALERTMANAGER_DEFAULT_WEBHOOK_URL"
              printf 'ALERTMANAGER_SLACK_API_URL=%s\n' "$ALERTMANAGER_SLACK_API_URL"
              printf 'ALERTMANAGER_SLACK_CHANNEL=%s\n' "$ALERTMANAGER_SLACK_CHANNEL"
              printf 'ALERTMANAGER_WEBHOOK_USER=%s\n' "$ALERTMANAGER_WEBHOOK_USER"
              printf 'ALERTMANAGER_WEBHOOK_PASS=%s\n' "$ALERTMANAGER_WEBHOOK_PASS"
            } >> /opt/mct-portal/.env
            chmod 600 /opt/mct-portal/.env
            # OBS-P2-013 fail-closed guard: an empty METRICS_TOKEN makes the API
            # /metrics endpoint 404 and the authenticated Prometheus scrape fail,
            # which false-fires MCTServiceDown and blinds monitoring. Production
            # must not ship without the token, so fail the deploy rather than
            # ship a permanently-down scrape; dev warns so iteration is not
            # blocked. Mirrors the watchdog guard below. Checked BEFORE the
            # credentials file is written so a failed prod deploy cannot clobber
            # the running stack's token file (Prometheus re-reads it per scrape).
            if [ -z "${METRICS_TOKEN:-}" ]; then
              if [ "${{ needs.setup.outputs.name }}" = "prod" ]; then
                echo "ERROR: METRICS_TOKEN is empty." >&2
                echo "OBS-P2-013 requires a non-empty METRICS_TOKEN: the API /metrics gate returns 404 without it, the Prometheus scrape fails, and MCTServiceDown false-fires." >&2
                echo "Set the repository/environment secret and re-run the deploy." >&2
                exit 1
              fi
              echo "WARNING: METRICS_TOKEN is empty in the '${{ needs.setup.outputs.name }}' environment — the API /metrics scrape will 404 and MCTServiceDown will false-fire. Production deploys will fail until it is set." >&2
            fi
            # Prometheus credentials_file for the authenticated mct-api scrape.
            # Written HERE because METRICS_TOKEN is forwarded to this step's
            # environment (the deploy step's envs list does not include it, so
            # writing it there produced an empty file and a down scrape).
            printf '%s' "$METRICS_TOKEN" > /opt/mct-portal/metrics-token
            # The prom/prometheus image runs as nobody (65534); a root-owned
            # 0600 file is unreadable to it ("unable to read authorization
            # credential"). Hand it to the container user, mode 400.
            chown 65534:65534 /opt/mct-portal/metrics-token
            chmod 400 /opt/mct-portal/metrics-token
            # IR-P0-003 fail-closed guard: the whole point of the dead-man's
            # switch is that a silent failure of the monitoring path must be
            # detectable. Compose would happily fall back to a no-op loopback URL
            # (http://127.0.0.1:1/noop) and the deploy would look green while
            # NOTHING could ever page us off-box. A missing watchdog URL in
            # PRODUCTION is a configuration error, not an optional feature, so
            # fail the deploy rather than ship an unmonitored production stack.
            # Dev warns instead, so iteration is not blocked on provisioning an
            # external heartbeat. (Critical/default/Slack receivers stay optional
            # everywhere: their absence is visible inside Alertmanager, and the
            # watchdog still routes.)
            if [ -z "${ALERTMANAGER_WATCHDOG_WEBHOOK_URL:-}" ]; then
              if [ "${{ needs.setup.outputs.name }}" = "prod" ]; then
                echo "ERROR: ALERTMANAGER_WATCHDOG_WEBHOOK_URL is empty." >&2
                echo "IR-P0-003 requires an EXTERNAL dead-man's-switch URL (not on this droplet)." >&2
                echo "Set the repository/environment secret and re-run the deploy." >&2
                exit 1
              fi
              echo "WARNING: ALERTMANAGER_WATCHDOG_WEBHOOK_URL is empty in the '${{ needs.setup.outputs.name }}' environment — no off-box dead-man's switch. Production deploys will fail until it is set." >&2
            fi
            if [ -z "${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-}" ]; then
              echo "WARNING: ALERTMANAGER_CRITICAL_WEBHOOK_URL is empty — critical alerts have no delivery path." >&2
            elif [ -z "${ALERTMANAGER_WEBHOOK_USER:-}" ] || [ -z "${ALERTMANAGER_WEBHOOK_PASS:-}" ]; then
              echo "WARNING: ALERTMANAGER_CRITICAL_WEBHOOK_URL is set but ALERTMANAGER_WEBHOOK_USER/PASS is empty — the webhook will be rejected (e.g. ntfy 403)." >&2
            fi
            echo "Droplet ready"

      - name: Deploy containers
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ needs.resolve-ip.outputs.droplet_ip }}
          username: root
          key: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DO_SSH_HOST_FINGERPRINT }}
          command_timeout: 45m
          envs: CF_ORIGIN_CERT,CF_ORIGIN_KEY,GHCR_TOKEN,GHCR_ACTOR,API_DIGEST,WORKER_DIGEST,WEB_DIGEST,IMAGE_TAG
          script: |
            set -e
            # The compose file's tag fallback (${IMAGE_TAG:?}) is interpolated
            # even when MCT_*_IMAGE digest refs are set, so the remote shell
            # must always have IMAGE_TAG (SBOM-P2-011 regression fix).
            export IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG must be set}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            mkdir -p /opt/mct-portal/certs
            printf '%s\n' "$CF_ORIGIN_CERT" > /opt/mct-portal/certs/fullchain.pem
            printf '%s\n' "$CF_ORIGIN_KEY" > /opt/mct-portal/certs/privkey.pem
            chmod 600 /opt/mct-portal/certs/privkey.pem
            # SBOM-P2-011: pull and run the exact digests that
            # verify-attestations resolved and attestation-verified, never the
            # mutable tag. A registry writer re-pointing the tag after
            # verification cannot substitute the artifact, and the tag is only
            # ever a fallback for manual operator runs (see the compose file).
            if [ -z "${API_DIGEST:-}" ] || [ -z "${WORKER_DIGEST:-}" ] || [ -z "${WEB_DIGEST:-}" ]; then
              echo "ERROR: resolved image digests are missing (verify-attestations outputs)." >&2
              echo "Refusing to deploy by mutable tag; re-run the workflow." >&2
              exit 1
            fi
            export MCT_API_IMAGE="${{ needs.setup.outputs.ghcr_prefix }}/mct-api@${API_DIGEST}"
            export MCT_WORKER_IMAGE="${{ needs.setup.outputs.ghcr_prefix }}/mct-worker@${WORKER_DIGEST}"
            export MCT_WEB_IMAGE="${{ needs.setup.outputs.ghcr_prefix }}/mct-web@${WEB_DIGEST}"
            echo "Deploying pinned images:"
            echo "  ${MCT_API_IMAGE}"
            echo "  ${MCT_WORKER_IMAGE}"
            echo "  ${MCT_WEB_IMAGE}"
            # NOTE: no `docker image prune` here — old mct-* images are still in
            # use until the rolling recreate below replaces them, so pruning
            # pre-pull would remove nothing.
            # Retry pulls — the droplet's connection to GHCR can reset mid-pull.
            pull_retry() {
              local img="$1" attempt=1
              until docker pull "$img"; do
                if [ "$attempt" -ge 3 ]; then
                  echo "ERROR: failed to pull $img after 3 attempts" >&2
                  return 1
                fi
                echo "WARNING: pull of $img failed (attempt $attempt/3) — retrying in 10s"
                attempt=$((attempt + 1))
                sleep 10
              done
            }
            pull_retry "${MCT_API_IMAGE}"
            pull_retry "${MCT_WORKER_IMAGE}"
            pull_retry "${MCT_WEB_IMAGE}"
            CADDYFILE="infra/digitalocean/Caddyfile.${{ needs.setup.outputs.name }}"
            [ -f "/opt/mct-portal/repo/$CADDYFILE" ] || CADDYFILE="infra/digitalocean/Caddyfile"
            if [ -s "/opt/mct-portal/certs/fullchain.pem" ] && [ -s "/opt/mct-portal/certs/privkey.pem" ]; then
              cp /opt/mct-portal/repo/$CADDYFILE /opt/mct-portal/Caddyfile
            else
              echo "WARNING: Cert files empty/missing, using tls internal fallback"
              sed 's|tls /etc/caddy/certs/fullchain.pem /etc/caddy/certs/privkey.pem|tls internal|' /opt/mct-portal/repo/$CADDYFILE > /opt/mct-portal/Caddyfile
            fi
            cp /opt/mct-portal/repo/infra/digitalocean/docker-compose.yml /opt/mct-portal/docker-compose.yml
            cp /opt/mct-portal/repo/infra/digitalocean/redis-entrypoint.sh /opt/mct-portal/redis-entrypoint.sh
            cp /opt/mct-portal/repo/infra/digitalocean/prometheus.yml /opt/mct-portal/prometheus.yml
            cp /opt/mct-portal/repo/infra/digitalocean/prometheus.rules.yml /opt/mct-portal/prometheus.rules.yml
            # IR-P0-003: the alertmanager service in docker-compose.yml mounts
            # ./alertmanager.tmpl.yml read-only. If it is not copied, compose
            # creates a directory at that path and the container fails to start
            # (or, worse, the alerting path is silently absent).
            cp /opt/mct-portal/repo/infra/digitalocean/alertmanager.tmpl.yml /opt/mct-portal/alertmanager.tmpl.yml
            # OBS-P3-005: the renderer the alertmanager entrypoint runs is also
            # a bind mount; it must exist or the container cannot render the
            # template.
            cp /opt/mct-portal/repo/infra/digitalocean/render-alertmanager.awk /opt/mct-portal/render-alertmanager.awk
            cd /opt/mct-portal
            # OBS-P2-015: replacing a container destroys its json-file logs, so
            # incident evidence vanished on every deploy. Snapshot the running
            # stack's logs (gzipped, last 7 kept) before the rolling recreate.
            # Shipping off-box remains an operator follow-up (see
            # docs/MONITORING_AND_ALERTING.md > Application-Level Logging).
            if docker compose -p mct-portal ps -q 2>/dev/null | grep -q .; then
              mkdir -p /opt/mct-portal/logs
              LOG_STAMP=$(date -u +%Y%m%dT%H%M%SZ)
              docker compose -p mct-portal logs --no-color --timestamps 2>&1 \
                | gzip -c > "/opt/mct-portal/logs/pre-deploy-$LOG_STAMP.log.gz" || true
              # Keep the most recent snapshots only so droplet disk stays bounded.
              ls -1t /opt/mct-portal/logs/pre-deploy-*.log.gz 2>/dev/null | tail -n +8 | xargs -r rm -f
              echo "Snapshotted pre-deploy container logs to /opt/mct-portal/logs/pre-deploy-$LOG_STAMP.log.gz"
            fi
            # Remember what is currently running so a failed deploy can revert.
            # SBOM-P2-011: keep the FULL image reference (a digest ref for
            # deploys after this change, a tag ref for older ones) so the
            # rollback path restores exactly what was running.
            PREV_API_IMAGE=$(docker inspect --format '{{.Config.Image}}' mct-portal-api-1 2>/dev/null || true)
            PREV_WORKER_IMAGE=$(docker inspect --format '{{.Config.Image}}' mct-portal-worker-1 2>/dev/null || true)
            PREV_WEB_IMAGE=$(docker inspect --format '{{.Config.Image}}' mct-portal-web-1 2>/dev/null || true)
            # Health probe for a compose container (probing the app ports from
            # the host does not work — only caddy publishes ports).
            container_health() {
              docker inspect --format '{{.State.Health.Status}}' "mct-portal-$1-1" 2>/dev/null || echo "missing"
            }
            recreate_service() {
              local svc="$1"
              # MCT_*_IMAGE (digest refs) are exported above; compose resolves
              # them per service (see infra/digitalocean/docker-compose.yml).
              docker compose -p mct-portal up -d --no-deps --remove-orphans "$svc"
            }
            wait_service_healthy() {
              local svc="$1" attempts="${2:-18}"
              for attempt in $(seq 1 "$attempts"); do
                if [ "$(container_health "$svc")" = "healthy" ]; then
                  echo "$svc healthy (attempt $attempt)"
                  return 0
                fi
                echo "Waiting for $svc to become healthy (attempt $attempt/$attempts)..."
                sleep 10
              done
              return 1
            }
            rollback_stack() {
              echo "Rolling back to the previously running images" >&2
              echo "  ${PREV_API_IMAGE:-<unset>} / ${PREV_WORKER_IMAGE:-<unset>} / ${PREV_WEB_IMAGE:-<unset>}" >&2
              docker compose -p mct-portal down --remove-orphans || true
              # Empty values fall back to the tag-based compose defaults.
              MCT_API_IMAGE="$PREV_API_IMAGE" \
              MCT_WORKER_IMAGE="$PREV_WORKER_IMAGE" \
              MCT_WEB_IMAGE="$PREV_WEB_IMAGE" \
                docker compose -p mct-portal up -d --remove-orphans || true
            }
            # RES-P2-010: rolling recreate. Previously `compose down` stopped
            # the whole stack, so every release and rollback was a planned full
            # outage. `up -d --no-deps` replaces ONE service at a time while
            # caddy keeps serving the others; wait for each to become healthy
            # before touching the next so a bad revision stops the rollout
            # early instead of taking every service down.
            deploy_failed=0
            for svc in api worker web; do
              if ! recreate_service "$svc"; then
                echo "ERROR: docker compose up failed for $svc" >&2
                deploy_failed=1
                break
              fi
              if ! wait_service_healthy "$svc"; then
                echo "ERROR: $svc did not become healthy after recreate" >&2
                deploy_failed=1
                break
              fi
            done
            if [ "$deploy_failed" = "1" ]; then
              docker compose -p mct-portal logs --tail=40 "$svc" 2>/dev/null || true
              if [ -n "$PREV_API_IMAGE" ] && [ "$PREV_API_IMAGE" != "$MCT_API_IMAGE" ]; then
                rollback_stack
              fi
              exit 1
            fi
            # Refresh the proxy last — the app services behind it are healthy.
            # RES-P3-012: reload the Caddyfile through Caddy's admin API
            # (zero downtime) instead of `docker rm -f` + recreate, which
            # SIGKILLed the only ingress and refused :443 until the new
            # container was up. `caddy reload` validates the config first: an
            # invalid Caddyfile is rejected and the running config keeps
            # serving. The Caddyfile is a bind-mounted file, so the copy above
            # is visible to the running container without a recreate.
            if ! docker exec mct-portal-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
              # Fallback when the admin API is unreachable: force-recreate in
              # place. Compose stops the old container gracefully (no SIGKILL)
              # and this still has a short gap, but only on this failure path.
              echo "WARNING: caddy reload failed; recreating the proxy container" >&2
              if ! docker compose -p mct-portal up -d --no-deps --force-recreate caddy; then
                echo "ERROR: failed to recreate caddy" >&2
                exit 1
              fi
            fi
            # Bring any remaining changed services (redis, prometheus,
            # alertmanager) up to date; a no-op for unchanged ones. The exported
            # MCT_*_IMAGE digest refs keep the app services pinned.
            docker compose -p mct-portal up -d --remove-orphans
            sleep 15
            echo "=== Docker compose ps ==="
            docker compose -p mct-portal ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}'
            echo "=== Port 443 listener ==="
            ss -tlnp 2>/dev/null | grep :443 || netstat -tlnp 2>/dev/null | grep :443 || echo "no listener"

            # Health gate: only prune the previous images once the new
            # containers report healthy, so a failed deploy can still roll
            # back. Use the containers' own healthchecks (probing the app
            # ports from the host does not work - they are not published).
            # INFRA-P2-007: assert EVERY service that declares a healthcheck,
            # not just api/web/worker. A restart-looping alertmanager (which
            # also takes prometheus down via depends_on), a broken caddy
            # config or a dead redis used to deploy green with the alerting
            # and reverse-proxy path silently gone.
            container_health() {
              docker inspect --format '{{.State.Health.Status}}' "mct-portal-$1-1" 2>/dev/null || echo "missing"
            }
            GATED_SERVICES="redis api worker web alertmanager prometheus node-exporter caddy"
            healthy=0
            for attempt in $(seq 1 18); do
              unhealthy=""
              for svc in $GATED_SERVICES; do
                status="$(container_health "$svc")"
                [ "$status" = "healthy" ] || unhealthy="${unhealthy} ${svc}=${status}"
              done
              if [ -z "$unhealthy" ]; then
                healthy=1
                echo "Health checks passed (attempt $attempt): ${GATED_SERVICES}"
                break
              fi
              echo "Waiting for services to become healthy (attempt $attempt/18):${unhealthy}"
              sleep 10
            done
            if [ "$healthy" != "1" ]; then
              echo "=== Alerting/proxy logs (last 30 lines each) ==="
              for svc in caddy alertmanager prometheus; do
                echo "--- ${svc} ---"
                docker compose -p mct-portal logs --tail=30 "$svc" 2>/dev/null || true
              done
              if [ -n "$PREV_API_IMAGE" ] && [ "$PREV_API_IMAGE" != "$MCT_API_IMAGE" ]; then
                echo "Attempting rollback to previously running images" >&2
                rollback_stack
              fi
              echo "ERROR: health checks failed after deploy" >&2
              exit 1
            fi

            echo "=== Pruning old mct images (keep the running digests) ==="
            # SBOM-P2-011: digest-pulled images carry no tag, so the previous
            # tag-based keep-list no longer matched. Keep the image IDs the
            # running containers use and remove every other mct-* image.
            KEEP_IDS="$(docker inspect --format '{{.Image}}' \
              mct-portal-api-1 mct-portal-worker-1 mct-portal-web-1 2>/dev/null | sort -u | tr '\n' ' ' || true)"
            if [ -n "$KEEP_IDS" ]; then
              for id in $(docker images --no-trunc --format '{{.ID}} {{.Repository}}' \
                | awk '/mct-(api|worker|web)/ {print $1}' | sort -u); do
                case " ${KEEP_IDS} " in
                  *" ${id} "*) ;;
                  *) docker rmi -f "${id}" >/dev/null 2>&1 || true ;;
                esac
              done
            else
              echo "WARNING: could not determine the running image IDs; skipping prune"
            fi
            docker image prune -f 2>/dev/null || true
        env:
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          # SBOM-P2-011: digests resolved and attestation-verified by the
          # verify-attestations job. The remote script pulls/runs these exact
          # digests instead of the mutable tag.
          API_DIGEST: ${{ needs['verify-attestations'].outputs.api_digest }}
          WORKER_DIGEST: ${{ needs['verify-attestations'].outputs.worker_digest }}
          WEB_DIGEST: ${{ needs['verify-attestations'].outputs.web_digest }}

      - name: Health check
        env:
          API_DOMAIN: ${{ needs.setup.outputs.api_domain }}
          APP_DOMAIN: ${{ needs.setup.outputs.app_domain }}
          DROPLET_IP: ${{ needs.resolve-ip.outputs.droplet_ip }}
          CI_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
          DO_SSH_HOST_KEY: ${{ secrets.DO_SSH_HOST_KEY }}
        run: |
          # The worker port is not published, so it must be checked over SSH.
          # Write the key so ssh can actually authenticate (without -i the
          # check silently returned 000 and was treated as non-fatal).
          KEY_FILE="$(mktemp)"
          printf '%s\n' "$CI_SSH_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          # CI-P3-003: verify the droplet host key instead of trusting any key
          # (the old StrictHostKeyChecking=no accepted a MITM). The pinned key
          # comes from the DO_SSH_HOST_KEY secret; refresh it if the droplet is
          # rebuilt (the fingerprints are on the droplet's /etc/ssh).
          KNOWN_HOSTS="$(mktemp)"
          # `awk` skips blank lines and always exits 0, so the step cannot trip
          # `set -e` on a trailing newline in the secret.
          printf '%s\n' "$DO_SSH_HOST_KEY" | awk -v ip="$DROPLET_IP" 'NF { print ip, $0 }' > "$KNOWN_HOSTS"
          SSH="ssh -i $KEY_FILE -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS -o ConnectTimeout=10 root@$DROPLET_IP"
          api_ok=""
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://$API_DOMAIN/health" 2>/dev/null | tr -d '\r\n' || echo "000")
            if [ "$CODE" = "200" ]; then echo "API ready after $((i*4))s (HTTP 200)"; api_ok=1; break; fi
            echo "Attempt $i/30: $CODE"; sleep 4
          done
          if [ -z "$api_ok" ]; then
            echo "===== API CONTAINER LOGS START ====="
            $SSH "docker ps -a --format '{{.Names}} {{.Status}}'; echo '---'; docker compose -p mct-portal logs --tail=50 api 2>/dev/null || docker logs mct-portal-api-1 --tail 50 2>/dev/null || echo 'no api container found'" || echo "SSH to droplet failed"
            echo "===== API CONTAINER LOGS END ====="
            rm -f "$KEY_FILE" "$KNOWN_HOSTS"
            exit 1
          fi
          echo "Worker health check via SSH..."
          worker_ok=""
          for i in $(seq 1 12); do
            wcode=$($SSH \
              "docker exec mct-portal-worker-1 wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1 && echo 200 || echo 000" 2>/dev/null | tr -d '\r\n' || echo "000")
            if [ "$wcode" = "200" ]; then
              echo "Worker healthy after $((i*5))s (HTTP 200)"; worker_ok=1; break
            fi
            echo "Worker attempt $i/12: HTTP $wcode"; sleep 5
          done
          if [ -z "$worker_ok" ]; then
            echo "===== WORKER CONTAINER LOGS START ====="
            $SSH "docker compose -p mct-portal logs --tail=50 worker 2>/dev/null || docker logs mct-portal-worker-1 --tail 50 2>/dev/null || echo 'no worker container found'" || echo "SSH to droplet failed"
            echo "===== WORKER CONTAINER LOGS END ====="
            rm -f "$KEY_FILE" "$KNOWN_HOSTS"
            echo "Worker health check failed" >&2
            exit 1
          fi
          rm -f "$KEY_FILE" "$KNOWN_HOSTS"
          web_ok=""
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://$APP_DOMAIN/login" 2>/dev/null | tr -d '\r\n' || echo "000")
            # Only redirect + success codes are healthy (200, 301, 302, 307);
            # a 500/502/503 means the app booted but is failing.
            if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ] || [ "$CODE" = "307" ]; then
              echo "Web ready after $((i*4))s (HTTP $CODE)"; web_ok=1; break
            fi
            echo "Attempt $i/15: $CODE"; sleep 4
          done
          [ -z "$web_ok" ] && { echo "Web health check failed"; exit 1; }
          echo "--- ALL HEALTH CHECKS PASSED ---"
