name: Database Backup
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    # Backups target the dev database/buckets; the dev environment holds
    # the SUPABASE_*/Spaces secrets these jobs resolve.
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run database backup script
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Prefer dedicated AWS_* secrets; fall back to the Spaces keys the
          # dev environment already carries (Spaces is S3-compatible).
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # Spaces endpoint by default; override with the S3_ENDPOINT variable
          # for real AWS S3 or another Spaces region.
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT || 'https://nyc3.digitaloceanspaces.com' }}
          # Destination contract (audit DR-P1-002 / IR-P1-005): S3_BUCKET is a
          # bucket NAME (no s3:// scheme) and S3_PREFIX is a key prefix. The
          # restore test reads the SAME two values. Fall back to the legacy
          # S3_BACKUP_BUCKET secret for the bucket name during transition.
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BACKUP_BUCKET || 'mainecybertech-backups' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'database-backups' }}
          # Optional offsite/cross-region copy (audit DR-P1-003). Set the
          # S3_OFFSITE_BUCKET variable to enable a second destination.
          S3_OFFSITE_BUCKET: ${{ vars.S3_OFFSITE_BUCKET }}
          S3_OFFSITE_PREFIX: ${{ vars.S3_OFFSITE_PREFIX || 'database-backups' }}
          # Client-side encryption at rest (audit DR-P1-003). Key is a secret;
          # never echoed. REQUIRE_BACKUP_ENCRYPTION makes an unencrypted upload
          # a hard failure so this cannot silently regress.
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          REQUIRE_BACKUP_ENCRYPTION: "1"
          # Fail the job if no non-empty dump was produced.
          VERIFY_BACKUP: "1"
        run: bash scripts/backup-database.sh
      - name: Notify on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_ALERTS_URL }}
          NTFY_USER: ${{ secrets.NTFY_ALERTS_USER }}
          NTFY_PASS: ${{ secrets.NTFY_ALERTS_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="❌ Database backup failed for develop branch. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # DR-P2-003: do not swallow delivery failures. A notifier that fails
          # silently (or a missing channel) is exactly how a backup outage goes
          # unnoticed, so this step must fail loudly — the run is already red.
          if [ -n "$NTFY_URL" ]; then
            curl -sf -u "$NTFY_USER:$NTFY_PASS" \
              -H "Title: Database backup failed" -H "Priority: high" -H "Tags: rotating_light" \
              -d "$MESSAGE" "$NTFY_URL"
            echo "Notified via ntfy"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" "$SLACK_WEBHOOK_URL"
            echo "Notified via Slack"
          else
            echo "::error::Backup failure notification could not be delivered: set NTFY_ALERTS_URL or SLACK_WEBHOOK_URL"
            exit 1
          fi
