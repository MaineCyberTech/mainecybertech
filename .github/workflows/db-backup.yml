name: Database Backup

# Daily encrypted pg_dump to S3/Spaces.
#
# Scheduled runs target the dev database/buckets (the `dev` environment holds
# the SUPABASE_*/Spaces secrets these jobs resolve).
#
# DATA-P2-010: production long-term backup is a supported target:
#   * workflow_dispatch `environment: prod` runs from `main` and attaches the
#     approval-gated `prod-approval` environment (required reviewers must be
#     configured in GitHub for the gate to be real).
#   * the schedule targets prod automatically once the operator sets the
#     `PROD_BACKUP_ENABLED` repository variable to `true`. That run attaches
#     `prod-backup` instead of `dev` (one schedule target at a time; dispatch
#     `environment: dev` manually to keep the dev dump). Create `prod-backup`
#     with the prod backup secrets and NO required reviewers: an approval-gated
#     environment would leave an unattended scheduled backup waiting for a
#     human instead of running.
# Operator dependency (cannot be set from the repo): the prod backup secrets
# (`SUPABASE_DB_URL`, `BACKUP_ENCRYPTION_KEY`, `AWS_*`/`DO_SPACES_*`,
# `S3_BUCKET`/`S3_PREFIX`) must be provisioned in the environment the job
# attaches — see docs/GITHUB_SECRETS_AND_VARIABLES_MATRIX.md.
#
# On success the job records a platform heartbeat (DR-P2-008) so the worker's
# backup-dr-check alerts when the REAL backups go stale.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (prod dispatch requires main + the prod-approval gate)"
        type: choice
        options:
          - dev
          - prod
        default: dev

permissions:
  contents: read

jobs:
  backup:
    # Dispatch: the selected environment (prod -> the approval-gated
    # prod-approval). Schedule: dev normally; prod-backup once the operator has
    # enabled the scheduled prod target.
    environment: ${{ (github.event.inputs.environment == 'prod') && 'prod-approval' || (github.event_name == 'schedule' && vars.PROD_BACKUP_ENABLED == 'true') && 'prod-backup' || 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Restrict prod dispatch to the main branch
        # A prod backup must run the workflow definition that is on main, not
        # an arbitrary feature branch.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::environment=prod can only be dispatched from the main branch (got ${GITHUB_REF}). Promote develop -> main first."
            exit 1
          fi

      - name: Record tool versions
        # DR-P3-003: aws/jq and (when present) pg_dump come from the runner
        # image; the fallback client container in scripts/backup-database.sh is
        # digest-pinned. Record the versions so a backup result is triageable.
        run: |
          aws --version
          jq --version
          (pg_dump --version || echo "pg_dump not on runner — script uses the pinned postgres:16-alpine client container")

      - name: Run database backup script
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Prefer dedicated AWS_* secrets; fall back to the Spaces keys the
          # dev environment already carries (Spaces is S3-compatible).
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # Spaces endpoint by default; override with the S3_ENDPOINT variable
          # for real AWS S3 or another Spaces region.
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT || 'https://nyc3.digitaloceanspaces.com' }}
          # Destination contract (audit DR-P1-002 / IR-P1-005): S3_BUCKET is a
          # bucket NAME (no s3:// scheme) and S3_PREFIX is a key prefix. The
          # restore test reads the SAME two values. Fall back to the legacy
          # S3_BACKUP_BUCKET secret for the bucket name during transition.
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BACKUP_BUCKET || 'mainecybertech-backups' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'database-backups' }}
          # Optional offsite/cross-region copy (audit DR-P1-003). Set the
          # S3_OFFSITE_BUCKET variable to enable a second destination.
          S3_OFFSITE_BUCKET: ${{ vars.S3_OFFSITE_BUCKET }}
          S3_OFFSITE_PREFIX: ${{ vars.S3_OFFSITE_PREFIX || 'database-backups' }}
          # Client-side encryption at rest (audit DR-P1-003). Key is a secret;
          # never echoed. REQUIRE_BACKUP_ENCRYPTION makes an unencrypted upload
          # a hard failure so this cannot silently regress.
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          REQUIRE_BACKUP_ENCRYPTION: "1"
          # Fail the job if no non-empty dump was produced.
          VERIFY_BACKUP: "1"
        run: bash scripts/backup-database.sh

      - name: Record platform backup heartbeat
        # DR-P2-008: the last successful run is the platform's real backup
        # signal (the client-facing `backup_status` module is product data).
        # Fail closed — an unrecorded success is indistinguishable from a
        # stopped backup.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HEARTBEAT_WORKFLOW: db-backup
        run: bash scripts/record-backup-heartbeat.sh

      - name: Notify on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_ALERTS_URL }}
          NTFY_USER: ${{ secrets.NTFY_ALERTS_USER }}
          NTFY_PASS: ${{ secrets.NTFY_ALERTS_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="❌ Database backup failed. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # DR-P2-003: do not swallow delivery failures. A notifier that fails
          # silently (or a missing channel) is exactly how a backup outage goes
          # unnoticed, so this step must fail loudly — the run is already red.
          if [ -n "$NTFY_URL" ]; then
            curl -sf -u "$NTFY_USER:$NTFY_PASS" \
              -H "Title: Database backup failed" -H "Priority: high" -H "Tags: rotating_light" \
              -d "$MESSAGE" "$NTFY_URL"
            echo "Notified via ntfy"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" "$SLACK_WEBHOOK_URL"
            echo "Notified via Slack"
          else
            echo "::error::Backup failure notification could not be delivered: set NTFY_ALERTS_URL or SLACK_WEBHOOK_URL"
            exit 1
          fi
