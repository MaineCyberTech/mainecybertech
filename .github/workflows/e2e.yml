name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/e2e/**"
      - "apps/web/playwright.config.ts"
      - "packages/**"
      - "supabase/seeds/**"
      - "supabase/migrations/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/e2e/**"
      - "apps/web/playwright.config.ts"
      - "packages/**"
      - "supabase/seeds/**"
      - "supabase/migrations/**"
      - ".github/workflows/e2e.yml"
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_PORT: 5432

      - name: Apply migrations and seeds
        run: supabase db reset

      - name: Sync Supabase env to API
        run: |
          API_ENV="apps/api/.env.local"
          # supabase status --output json returns UPPERCASE keys (API_URL,
          # ANON_KEY, SERVICE_ROLE_KEY) — lowercase jq selectors yield null.
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" > $API_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $API_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> $API_ENV
          echo "CORS_ORIGIN=*" >> $API_ENV
          echo "LOG_LEVEL=silent" >> $API_ENV
          echo "JWT_SECRET=e2e-test-secret" >> $API_ENV
          # Also write root .env.local for dotenv.config({ path: ".env.local" }) in main.ts
          cp $API_ENV .env.local

      - name: Build API
        run: pnpm --filter=api build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start API server
        run: |
          cat apps/api/.env.local | sed 's/=.*/=<redacted>/'
          echo "--- supabase status json ---"
          supabase status --output json | head -c 600
          echo ""
          echo "--- starting API ---"
          pnpm --filter=api start > api.log 2>&1 &
          sleep 3
          echo "--- api.log ---"
          cat api.log
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:4000/health
        env:
          NODE_ENV: production
          CORS_ORIGIN: "*"
          LOG_LEVEL: silent
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET || 'e2e-test-secret' }}

      - name: Build web app
        run: pnpm --filter=web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start web app
        run: |
          pnpm --filter=web start &
          sleep 5
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          PORT: 3000

      - name: Diagnose API login flow
        run: |
          echo "=== API health body ==="
          curl -sS http://localhost:4000/health || echo "API DOWN"
          echo ""
          echo "=== Sign-in ==="
          RESP=$(curl -sS -w "\n%{http_code}" -X POST http://localhost:4000/api/v1/auth/sign-in \
            -H "Content-Type: application/json" \
            -d '{"email":"superadmin.real@mainecybertech.local","password":"1"}')
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          echo "sign-in HTTP: $CODE"
          echo "sign-in body: ${BODY:0:200}"
          TOKEN=$(echo "$BODY" | jq -r '.data.accessToken // empty' 2>/dev/null)
          if [ -n "$TOKEN" ]; then
            echo "=== /auth/me ==="
            curl -sS http://localhost:4000/api/v1/auth/me -H "Authorization: Bearer $TOKEN"
            echo ""
            echo "=== memberships (raw) ==="
            curl -sS "http://localhost:4000/api/v1/memberships?user_id=66ce903f-6fe0-45da-878b-a0398e6b1981&status=approved" -H "Authorization: Bearer $TOKEN"
            echo ""
            echo "=== memberships no params (org-access path) ==="
            curl -sS "http://localhost:4000/api/v1/memberships" -H "Authorization: Bearer $TOKEN"
          fi

      - name: Run Playwright tests
        run: pnpm --filter=web e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: superadmin.real@mainecybertech.local
          E2E_ADMIN_PASSWORD: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
