name: E2E

on:
  workflow_dispatch:
  # Push trigger removed: the PR run plus the prod deploy's `workflow_call`
  # gate already cover changes, and a push trigger ran E2E 2-3x per change.
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/e2e/**"
      - "apps/web/playwright.config.ts"
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "packages/**"
      - "supabase/seeds/**"
      - "supabase/migrations/**"
      - ".github/workflows/e2e.yml"
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Supabase CLI
        # Pinned and installed from npm rather than `supabase/setup-cli` with
        # `version: latest`: the action resolves `releases/latest` via the
        # GitHub API, which intermittently fails E2E with
        # "Failed to resolve latest Supabase CLI release: rate limit exceeded".
        # Matches the pin in supabase-migrations.yml / package.json.
        run: npm install -g supabase@2.107.0

      - name: Start Supabase
        # `supabase start` pulls ~13 images from Docker Hub; the shared runner
        # intermittently hits "toomanyrequests: Rate exceeded", which is
        # transient, so retry with backoff before failing the job.
        run: |
          for attempt in 1 2 3; do
            if supabase start; then
              exit 0
            fi
            echo "supabase start failed (attempt ${attempt}/3) - retrying in 20s"
            sleep 20
          done
          echo "supabase start failed after 3 attempts"
          exit 1
        env:
          SUPABASE_DB_HOST: localhost
          SUPABASE_DB_PORT: 5432

      - name: Apply migrations and seeds
        run: supabase db reset

      - name: Sync Supabase env to API
        run: |
          API_ENV="apps/api/.env.local"
          # supabase status --output json returns UPPERCASE keys (API_URL,
          # ANON_KEY, SERVICE_ROLE_KEY) â€” lowercase jq selectors yield null.
          echo "SUPABASE_URL=$(supabase status --output json | jq -r '.API_URL')" > $API_ENV
          echo "SUPABASE_ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $API_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status --output json | jq -r '.SERVICE_ROLE_KEY')" >> $API_ENV
          echo "CORS_ORIGIN=http://localhost:3000" >> $API_ENV
          echo "LOG_LEVEL=silent" >> $API_ENV
          echo "JWT_SECRET=e2e-test-secret-32-characters-long" >> $API_ENV
          # Also write root .env.local for dotenv.config({ path: ".env.local" }) in main.ts
          cp $API_ENV .env.local

      - name: Build API
        run: pnpm --filter=api build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start API server
        run: |
          cat apps/api/.env.local | sed 's/=.*/=<redacted>/'
          echo "--- starting API (sourcing .env.local) ---"
          set -a
          . ./apps/api/.env.local
          set +a
          echo "SUPABASE_URL check: ${SUPABASE_URL:0:30}..."
          pnpm --filter=api start > api.log 2>&1 &
          sleep 3
          echo "--- api.log ---"
          cat api.log
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:4000/health
        env:
          NODE_ENV: production
          CORS_ORIGIN: "http://localhost:3000"
          LOG_LEVEL: silent
          JWT_SECRET: ${{ secrets.E2E_JWT_SECRET || 'e2e-test-secret-32-characters-long' }}

      - name: Build web app
        run: pnpm --filter=web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start web app
        run: |
          pnpm --filter=web start &
          sleep 5
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3000
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          PORT: 3000

      - name: Run Playwright tests
        run: pnpm --filter=web e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_ADMIN_EMAIL: superadmin.real@mainecybertech.local
          E2E_ADMIN_PASSWORD: 1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          # The config writes the HTML report / traces to the repo root
          # (.playwright-report / .playwright-results), not under apps/web.
          path: |
            .playwright-report/
            .playwright-results/
          if-no-files-found: ignore
          retention-days: 7
