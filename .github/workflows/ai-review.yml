name: ai-review

# Advisory AI review. The implementation lives in the reusable
# MaineCyberTech/ai-reviewer repository; this file is only the caller.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    uses: MaineCyberTech/ai-reviewer/.github/workflows/ai-review.yml@695d976eac4d25fec377ccb5e4af51617bf9fdc3
    secrets:
      AI_REVIEW_ENDPOINT: ${{ secrets.AI_REVIEW_ENDPOINT }}
      AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
      AI_REVIEW_MODEL: ${{ secrets.AI_REVIEW_MODEL }}
    with:
      pr: ${{ inputs.pr || 0 }}
