name: ai-review

# Advisory AI review. The implementation lives in the reusable
# MaineCyberTech/ai-reviewer repository; this file is only the caller.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: MaineCyberTech/ai-reviewer/.github/workflows/ai-review.yml@02fc7613f5f08bea2619ef54a35cfd6e25349b5a
    secrets: inherit
    with:
      pr: ${{ inputs.pr || 0 }}
