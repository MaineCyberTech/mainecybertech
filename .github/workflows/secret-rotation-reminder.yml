name: Secret Rotation Reminder

# Creates a quarterly issue so the rotation policy in docs/SECRETS_ROTATION.md
# is calendar-independent and verifiable (audit SECRET-P2-002). Uses the
# runner's `gh` CLI so no new action needs SHA pinning; skips when a reminder
# issue is already open. Manual runs: Actions → Secret Rotation Reminder → Run.
on:
  schedule:
    # Quarterly: 1 Jan / Apr / Jul / Oct at 09:00 UTC.
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create reminder issue (deduplicated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --search "Quarterly secret rotation review in:title" \
            --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "A rotation reminder issue is already open; nothing to do."
            exit 0
          fi
          gh label create secret-rotation --repo "$GITHUB_REPOSITORY" \
            --color FBCA04 --description "Secret rotation reminder" 2>/dev/null || true
          body=$(cat <<'EOF'
          ## Quarterly secret rotation review

          The rotation policy in [docs/SECRETS_ROTATION.md](https://github.com/MaineCyberTech/mainecybertech/blob/HEAD/docs/SECRETS_ROTATION.md) is due for its quarterly review:

          - [ ] Review the inventory — is any secret past its rotation frequency?
          - [ ] Rotate what is due (90-day keys first).
          - [ ] Do **not** rotate `BACKUP_ENCRYPTION_KEY` or `FIELD_ENCRYPTION_KEY` on schedule — follow their re-encryption procedures.
          - [ ] Update the **Rotation Log** table with date, secrets, operator and environment.
          - [ ] Confirm the GitHub environment secrets and the droplet `.env` agree after the next deploy.
          - [ ] Close this issue once the log is updated.
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Quarterly secret rotation review" \
            --label secret-rotation \
            --body "$body"
