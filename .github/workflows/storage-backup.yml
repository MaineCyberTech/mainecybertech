name: Storage Backup

# Backs up user-uploaded Supabase Storage objects (documents / avatars / logos)
# to an S3/Spaces destination (audit finding DR-P1-001). Mirrors db-backup.yml:
# scheduled daily, dispatched manually, Slack on failure.
#
# Runs against the `dev` environment (which carries SUPABASE_URL /
#   SUPABASE_SERVICE_ROLE_KEY). Required secrets: BACKUP_ENCRYPTION_KEY,
#   SLACK_WEBHOOK_URL (optional); AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY fall
#   back to the environment's DO_SPACES_ACCESS_KEY_ID/DO_SPACES_SECRET_ACCESS_KEY.
# Required variables: S3_BUCKET (bucket NAME; falls back to the
#   S3_BACKUP_BUCKET secret). Optional: S3_PREFIX, S3_OFFSITE_BUCKET,
#   S3_ENDPOINT (default https://nyc3.digitaloceanspaces.com).
#
# NOTE: schedules only fire from the default branch (`main`), so this file must
# stay on `main`. The interim backup-dispatch.yml dispatcher was retired once
# the backup workflows landed there (CI-P2-010).

on:
  schedule:
    - cron: "0 5 * * *"   # daily, one hour after the database backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-backup:
    # Backups target the dev database/buckets; the dev environment holds
    # the SUPABASE_*/Spaces secrets these jobs resolve.
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run storage backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Prefer dedicated AWS_* secrets; fall back to the Spaces keys the
          # dev environment already carries (Spaces is S3-compatible).
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.DO_SPACES_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # Spaces endpoint by default; override with the S3_ENDPOINT variable
          # for real AWS S3 or another Spaces region.
          AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT || 'https://nyc3.digitaloceanspaces.com' }}
          # Destination contract mirrors scripts/backup-database.sh (DR-P1-002).
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BACKUP_BUCKET || 'mainecybertech-backups' }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'storage-backups' }}
          S3_OFFSITE_BUCKET: ${{ vars.S3_OFFSITE_BUCKET }}
          S3_OFFSITE_PREFIX: ${{ vars.S3_OFFSITE_PREFIX || 'storage-backups' }}
          STORAGE_BUCKETS: ${{ vars.STORAGE_BUCKETS || 'documents avatars logos' }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          REQUIRE_BACKUP_ENCRYPTION: "1"
          # Fail the job if the archive is not a readable tar carrying the
          # manifest (DR-P2-001); the script also refuses empty/partial mirrors.
          VERIFY_BACKUP: "1"
        run: bash scripts/backup-storage.sh

      - name: Notify on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_ALERTS_URL }}
          NTFY_USER: ${{ secrets.NTFY_ALERTS_USER }}
          NTFY_PASS: ${{ secrets.NTFY_ALERTS_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="❌ Supabase Storage backup failed — uploaded files may not be recoverable. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # DR-P2-003: do not swallow delivery failures. A notifier that fails
          # silently (or a missing channel) is exactly how a backup outage goes
          # unnoticed, so this step must fail loudly — the run is already red.
          if [ -n "$NTFY_URL" ]; then
            curl -sf -u "$NTFY_USER:$NTFY_PASS" \
              -H "Title: Storage backup failed" -H "Priority: high" -H "Tags: rotating_light" \
              -d "$MESSAGE" "$NTFY_URL"
            echo "Notified via ntfy"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" "$SLACK_WEBHOOK_URL"
            echo "Notified via Slack"
          else
            echo "::error::Backup failure notification could not be delivered: set NTFY_ALERTS_URL or SLACK_WEBHOOK_URL"
            exit 1
          fi
