name: Validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Dependency audit + license policy + Trivy fs — shared with
      # test.yml's security-scan (PR side).
      - uses: ./.github/actions/dependency-audit

      - name: Verify tracked shell scripts are executable
        # PORT-001: docs instruct operators to run `./scripts/...`; a missing
        # exec bit only fails on Linux/macOS, at the worst possible moment
        # (incident/rollback). Fail the deploy gate if any tracked *.sh is 100644.
        run: |
          set -e
          bad=$(git ls-files -s | awk '$1 == "100644" && $4 ~ /\.sh$/ { print $4 }')
          if [ -n "$bad" ]; then
            echo "::error::Tracked .sh files are missing the executable bit:"
            printf '%s\n' "$bad"
            echo "Fix: git update-index --chmod=+x <file>"
            exit 1
          fi

      - name: Reject merge-conflict markers
        # The 2026-10-11 remediation wave merged a workflow file with conflict
        # markers, which made deploy-do fail with zero jobs (invalid YAML) and
        # blocked every deploy until repaired. Fail the gate on any marker
        # outside the archived audit corpus.
        run: |
          set -e
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!docs/audits'; then
            echo "::error::Merge-conflict markers found in tracked files."
            exit 1
          fi

      - name: Validate Prometheus alert rules
        # IR-P2-010 / OBS-P2-012: promtool check rules + promtool test rules
        # against the digest-pinned prom/prometheus image (same one the droplet
        # compose runs). Shared with test.yml's required test job.
        uses: ./.github/actions/prometheus-rules

      - name: ShellCheck incident-path scripts
        # INFRA-P2-006: the manual rollback script must stay statically clean
        # (it shipped with an unbound GHCR_TOKEN reference and a wrong image
        # prefix). Shared with test.yml's required test job.
        uses: ./.github/actions/shellcheck

