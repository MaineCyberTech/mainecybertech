name: Chromatic

on:
  push:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    # Best-effort: the Storybook webpack build currently fails with
    # SB_BUILDER-WEBPACK5_0002 ("Cannot read properties of undefined (reading
    # 'tap')") - a webpack-instance/plugin mismatch that needs a dedicated fix.
    # Job-level continue-on-error keeps the pipeline green while the failure
    # stays visible in the job status (previously it was hidden per-step).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          # corepack fetches pnpm from the npm registry; retry transient failures.
          ok=""
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10 --activate; then ok=1; break; fi
            echo "corepack prepare failed (attempt $attempt/3)" >&2
            sleep 10
          done
          test -n "$ok"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Chromatic
        uses: chromaui/action@1cfa065cbdab28f6ca3afaeb3d761383076a35aa
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: docs/storybook-static
          onlyChanged: true
          exitZeroOnChanges: true
          exitOnceUploaded: true