name: Chromatic

on:
  push:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/components/**'
      - '.storybook/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/components/**'
      - '.storybook/**'

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking (CI-P2-006): no job-level continue-on-error. A broken Storybook
    # build fails this job instead of being masked green, and once a baseline
    # exists a visual change fails it too. The Storybook webpack build still
    # fails with SB_BUILDER-WEBPACK5_0002 ("Cannot read properties of undefined
    # (reading 'tap')") - a webpack-instance/plugin mismatch that needs a
    # dedicated fix; the red job is now the honest signal for that debt. The
    # job is not a required check yet: promoting it in branch protection is a
    # repo-admin action once the build failure is fixed.
    #
    # TEST-P3-001 root cause (webpack >= 5.101.3 + Storybook 8.6.x): the
    # builder's standalone DefinePlugin taps parser hooks created by Next's
    # vendored webpack (storybookjs/storybook#32301; fixed for Storybook >= 9
    # by storybookjs/storybook#32306). Remediation, once the lockfile can be
    # regenerated: upgrade Storybook past the fix, or pin webpack to 5.101.2
    # via the root package.json `pnpm.overrides` (then `pnpm install`). Both
    # are dependency changes, so they need a dedicated PR - do not hand-edit
    # pnpm-lock.yaml. Details: docs/CI.md ("Chromatic").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          # corepack fetches pnpm from the npm registry; retry transient failures.
          ok=""
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10 --activate; then ok=1; break; fi
            echo "corepack prepare failed (attempt $attempt/3)" >&2
            sleep 10
          done
          test -n "$ok"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Chromatic
        uses: chromaui/action@1cfa065cbdab28f6ca3afaeb3d761383076a35aa
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: docs/storybook-static
          onlyChanged: true
          # Wait for the build result and fail on visual changes once a
          # baseline exists (new stories never count as changes). This is the
          # "blocking when a baseline exists" half of CI-P2-006; exitOnceUploaded
          # would exit before the diff result is known.
          exitZeroOnChanges: false