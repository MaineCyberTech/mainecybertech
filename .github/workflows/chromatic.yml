name: Chromatic

on:
  push:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/components/**'
      - '.storybook/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'packages/ui/**'
      - 'apps/web/components/**'
      - '.storybook/**'

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Blocking (CI-P2-006): no job-level continue-on-error. A broken Storybook
    # build fails this job instead of being masked green, and once a baseline
    # exists a visual change fails it too. The webpack >= 5.101.3 / Storybook
    # 8.6.x SB_BUILDER-WEBPACK5_0002 break is fixed by the root package.json
    # pnpm.overrides pin of webpack 5.101.2 (#280): post-pin runs build
    # Storybook and fail only at the Chromatic diff step. The job is not a
    # required check yet: promoting it in branch protection is a repo-admin
    # action.
    #
    # TEST-P3-001 root cause (webpack >= 5.101.3 + Storybook 8.6.x): the
    # builder's standalone DefinePlugin tapped parser hooks created by Next's
    # vendored webpack (storybookjs/storybook#32301; fixed for Storybook >= 9
    # by storybookjs/storybook#32306). The pin is the applied remediation;
    # upgrading Storybook past the fix remains the follow-up option. Details:
    # docs/CI.md ("Chromatic").
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20

      - name: Install pnpm
        run: |
          corepack enable
          # corepack fetches pnpm from the npm registry; retry transient failures.
          ok=""
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10 --activate; then ok=1; break; fi
            echo "corepack prepare failed (attempt $attempt/3)" >&2
            sleep 10
          done
          test -n "$ok"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm storybook:build

      - name: Chromatic
        uses: chromaui/action@1cfa065cbdab28f6ca3afaeb3d761383076a35aa
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: docs/storybook-static
          onlyChanged: true
          # Wait for the build result and fail on visual changes once a
          # baseline exists (new stories never count as changes). This is the
          # "blocking when a baseline exists" half of CI-P2-006; exitOnceUploaded
          # would exit before the diff result is known.
          exitZeroOnChanges: false