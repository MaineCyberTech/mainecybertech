name: supabase-migrations

on:
  workflow_dispatch:
    inputs:
      allow_drift:
        description: "Set to 1 to bypass the pre-push schema-drift check (after reviewing the diff)"
        type: choice
        options: ["0", "1"]
        default: "0"
  push:
    branches: [develop, main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_call:

permissions:
  contents: read

# Serialize migration runs per branch: concurrent `supabase db push` against the
# same hosted project can interleave and corrupt the migrations table.
concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          # corepack fetches pnpm from the npm registry; retry transient failures.
          ok=""
          for attempt in 1 2 3; do
            if corepack prepare pnpm@10 --activate; then ok=1; break; fi
            echo "corepack prepare failed (attempt $attempt/3)" >&2
            sleep 10
          done
          test -n "$ok"

      - name: Install Supabase CLI
        # Pinned to 2.107.0 to match the repo's pnpm-lock.yaml (supabase@2.107.0).
        # Unpinned installs made migration behavior nondeterministic.
        run: npm install -g supabase@2.107.0

      - name: Link project
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Diff migrations (dry-run; fails on unexpected drift)
        # Audit IR-P1-002: the previous `|| true` swallowed the dry-run, so a
        # destructively divergent schema was never seen before `db push`.
        # Now the diff is captured: a non-empty diff FAILS the run so an
        # operator must reconcile it (or explicitly set ALLOW_MIGRATION_DRIFT=1
        # for a workflow_dispatch run after review).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ALLOW_MIGRATION_DRIFT: ${{ github.event.inputs.allow_drift || '0' }}
        run: |
          set -uo pipefail
          set +e
          DIFF="$(supabase db diff --linked --schema public 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$DIFF"
          if [ "$rc" -ne 0 ]; then
            echo "::error::supabase db diff failed (exit $rc) — cannot establish the pre-push schema state"
            exit 1
          fi
          # `db diff` prints the diff (exit 0) rather than failing on drift.
          if printf '%s' "$DIFF" | grep -Eq '^[[:space:]]*(alter|create|drop|comment)[[:space:]]'; then
            if [ "${ALLOW_MIGRATION_DRIFT}" = "1" ]; then
              echo "::warning::Schema drift detected but ALLOW_MIGRATION_DRIFT=1 — continuing"
            else
              echo "::error::Unreconciled schema drift detected before db push. Review the diff above; either commit the missing migration or re-run dispatch with allow_drift=1 after review."
              exit 1
            fi
          else
            echo "No unreconciled drift."
          fi

      - name: Run migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}