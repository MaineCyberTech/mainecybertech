name: Lint

# PR-only by design: on pushes to develop/main lint runs once through
# `deploy-do` → `validate.yml`. The push trigger here duplicated it.
on:
  workflow_dispatch:
  # Deliberately no `paths:` on pull_request (BP-P2-004): `lint (20.x)` is a
  # required check, and a path-filtered workflow never reports on docs-only
  # PRs — leaving them blocked or unguarded.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on the same ref (rapid pushes to a PR).
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint workspace
        run: pnpm lint
