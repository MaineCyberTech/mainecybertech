name: terraform-do

on:
  # Manual-only by design (2026-09-29): automatic push/PR runs failed on an
  # invalid DO_API_TOKEN and a develop push could reach dev apply without
  # review. Re-enable push/PR triggers once the token is rotated and the
  # environments have protection rules. A manual run plans by default; apply
  # only happens when the `apply` input is set.
  #
  # CI-P2-002: a weekly plan-only drift check runs from the default branch. It
  # stays dormant (job skipped) until DO_API_TOKEN is rotated AND the repository
  # variable `TF_DRIFT_PLAN_ENABLED` is set to `true`, so an invalid token cannot
  # fail a scheduled run. When enabled, a non-empty plan fails the run (alert).
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply after a successful plan (leave off to plan only)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Serialize terraform runs per branch: concurrent applies could corrupt the
# shared DO Spaces state lock or race each other (e.g. a push and a manual apply).
concurrency:
  group: terraform-do-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    # CI-P2-002: scheduled drift plans only run once the operator enables the
    # repository variable (after token rotation). Manual/push runs are unaffected.
    if: ${{ github.event_name != 'schedule' || vars.TF_DRIFT_PLAN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/digitalocean
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "name=prod" >> $GITHUB_OUTPUT
          else
            echo "name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Create tfvars file
        id: tfvars
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          DO_SSH_FINGERPRINT: ${{ secrets.DO_SSH_FINGERPRINT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_ID_US: ${{ secrets.CLOUDFLARE_ZONE_ID_US }}
          # SSH allowlist (JSON array of CIDRs). SSH is fail-closed: there is no
          # permissive default in variables.tf, so this must be set for every run.
          ADMIN_IP_RANGES: ${{ secrets.ADMIN_IP_RANGES }}
          # Both sizes are >=2GB: the compose stack reserves ~1.4GB of memory
          # limits, so the old dev default (s-1vcpu-512mb-10gb) was
          # under-provisioned and drifted from dev.tfvars.example
          # (INFRA-P2-004). The live dev droplet is s-1vcpu-2gb.
          DROPLET_SIZE: ${{ steps.env.outputs.name == 'prod' && 's-2vcpu-2gb' || 's-1vcpu-2gb' }}
          TF_ENV: ${{ steps.env.outputs.name }}
        run: |
          # printf '%s' never re-expands the value, so a secret containing
          # $, backticks or quotes cannot corrupt the file or execute.
          {
            printf 'do_token              = "%s"\n' "$DO_API_TOKEN"
            printf 'ssh_fingerprint       = "%s"\n' "$DO_SSH_FINGERPRINT"
            printf 'cloudflare_api_token  = "%s"\n' "$CLOUDFLARE_API_TOKEN"
            printf 'cloudflare_zone_id    = "%s"\n' "$CLOUDFLARE_ZONE_ID"
            printf 'cloudflare_zone_id_us = "%s"\n' "$CLOUDFLARE_ZONE_ID_US"
            printf 'admin_ip_ranges       = %s\n' "$ADMIN_IP_RANGES"
            printf 'droplet_size          = "%s"\n' "$DROPLET_SIZE"
            printf 'environment           = "%s"\n' "$TF_ENV"
          } > "$TF_ENV.tfvars"

      # Fail before init/plan if the allowlist is missing or still world-open.
      # Never plan/apply SSH exposed to 0.0.0.0/0 or ::/0.
      - name: Reject world-open SSH allowlist
        env:
          ADMIN_IP_RANGES: ${{ secrets.ADMIN_IP_RANGES }}
        run: |
          if [[ -z "$ADMIN_IP_RANGES" ]]; then
            echo "::error::secrets.ADMIN_IP_RANGES is not set (or empty). SSH is fail-closed; set it to your office/VPN CIDRs, e.g. [\"203.0.113.0/24\"]."
            exit 1
          fi
          if [[ "$ADMIN_IP_RANGES" == *"0.0.0.0/0"* || "$ADMIN_IP_RANGES" == *"::/0"* ]]; then
            echo "::error::secrets.ADMIN_IP_RANGES contains a world-open CIDR (0.0.0.0/0 or ::/0). Restrict SSH to office/VPN ranges before applying."
            exit 1
          fi

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=env/backend.${{ steps.env.outputs.name }}.hcl

      - name: Terraform Validate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          terraform plan \
            -var-file="${{ steps.env.outputs.name }}.tfvars" \
            -no-color \
            -input=false \
            -out=tfplan 2>&1 | tee ${{ runner.temp }}/tfplan.txt
        continue-on-error: false

      - name: Post plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ runner.temp }}/tfplan.txt', 'utf8');
            const envName = '${{ steps.env.outputs.name }}';
            const header = `## Terraform Plan (${envName})\n\n\`\`\`\n${planOutput.slice(0, 60000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: header
            });

      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tfplan-${{ steps.env.outputs.name }}
          path: infra/terraform/digitalocean/tfplan
          retention-days: 1

      - name: Fail scheduled run on infrastructure drift
        # CI-P2-002: the weekly plan-only run must alert (fail) when the
        # committed Terraform no longer matches the deployed droplet, instead of
        # silently recording a non-empty plan.
        if: github.event_name == 'schedule'
        run: |
          if grep -q "No changes." "${{ runner.temp }}/tfplan.txt"; then
            echo "No infrastructure drift detected"
          else
            echo "::error::Terraform plan is non-empty — infrastructure drift detected (see the tfplan artifact)."
            exit 1
          fi

  # ===== Deployment gates =====
  # validate always runs for every terraform run (test + lint + typecheck).
  validate-gate:
    needs: terraform-plan
    uses: ./.github/workflows/validate.yml
    secrets: inherit

  # e2e + migrations: required for the PROD apply only (firewall changes must not
  # ship with untested/ummigrated code — a malicious or broken PR could otherwise
  # silently open firewall rules). Skipped on develop to keep dev applies fast;
  # skipped jobs do not block the apply because apply-prod guards with
  # !failure() && !cancelled().
  e2e-gate:
    needs: terraform-plan
    if: github.ref_name == 'main'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  migrate-gate:
    needs: terraform-plan
    if: github.ref_name == 'main'
    uses: ./.github/workflows/supabase-migrations.yml
    secrets: inherit

  terraform-apply-prod:
    needs: [terraform-plan, validate-gate, e2e-gate, migrate-gate]
    if: ${{ inputs.apply && github.ref_name == 'main' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: prod-approval
    defaults:
      run:
        working-directory: infra/terraform/digitalocean
    outputs:
      droplet_ip: ${{ steps.apply.outputs.droplet_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfplan-prod
          path: infra/terraform/digitalocean

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=env/backend.prod.hcl

      - name: Terraform Apply
        id: apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve -input=false tfplan
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> $GITHUB_OUTPUT

  terraform-apply-dev:
    needs: [terraform-plan, validate-gate]
    if: ${{ inputs.apply && github.ref_name == 'develop' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/digitalocean
    outputs:
      droplet_ip: ${{ steps.apply.outputs.droplet_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tfplan-dev
          path: infra/terraform/digitalocean

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=env/backend.dev.hcl

      - name: Terraform Apply
        id: apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET_ACCESS_KEY }}
        run: |
          terraform apply -auto-approve -input=false tfplan
          echo "droplet_ip=$(terraform output -raw droplet_ip)" >> $GITHUB_OUTPUT
