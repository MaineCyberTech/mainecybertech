name: Secret history scan

# SECRET-P2-003: the PR/push secret scan is diff-scoped, so a credential that
# entered history before the scan existed (or via a force-push) is never
# re-examined. This scheduled/manual job scans the FULL git history with
# gitleaks, verifies the reviewed allowlist still catches a synthetic key, and
# uploads the JSON report as a durable artifact.
on:
  schedule:
    # Mondays 06:00 UTC, ahead of the weekly dependency/rotation cadence.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release
          # checksums file; refresh both together when bumping.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Full-history scan (fails on findings)
        run: |
          set -euo pipefail
          gitleaks detect --source . --redact --exit-code 1 \
            --report-format json --report-path gitleaks-history.json \
            --config .gitleaks.toml

      - name: Verify the allowlist still catches a synthetic key
        if: always()
        run: scripts/ci/verify-gitleaks-config.sh

      - name: Upload history report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-history-report
          path: gitleaks-history.json
          retention-days: 30

      - name: Notify on failure
        # SC-P2-011: this scan is scheduled, so without an alert a leaked
        # credential found here would sit unreviewed until someone opened the
        # run history. Same ntfy/Slack path as db-restore-test.yml.
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_ALERTS_URL }}
          NTFY_USER: ${{ secrets.NTFY_ALERTS_USER }}
          NTFY_PASS: ${{ secrets.NTFY_ALERTS_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="❌ Full-history secret scan failed — gitleaks may have found a credential in git history (or the allowlist probe failed). Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # DR-P2-003: do not swallow delivery failures. A notifier that fails
          # silently (or a missing channel) is exactly how a leaked credential
          # goes unnoticed, so this step must fail loudly — the run is already red.
          if [ -n "$NTFY_URL" ]; then
            curl -sf -u "$NTFY_USER:$NTFY_PASS" \
              -H "Title: Full-history secret scan failed" -H "Priority: high" -H "Tags: rotating_light" \
              -d "$MESSAGE" "$NTFY_URL"
            echo "Notified via ntfy"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" "$SLACK_WEBHOOK_URL"
            echo "Notified via Slack"
          else
            echo "::error::Secret-scan failure notification could not be delivered: set NTFY_ALERTS_URL or SLACK_WEBHOOK_URL"
            exit 1
          fi
