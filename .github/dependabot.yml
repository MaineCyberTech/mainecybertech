version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      sentry:
        patterns:
          - "@sentry/*"
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      testing:
        patterns:
          - "jest"
          - "@types/jest"
          - "ts-jest"
          - "supertest"
          - "@types/supertest"
          - "@testing-library/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    versioning-strategy: increase
    ignore:
      # Held majors are tracked in #361; remove an entry in the same PR that
      # lands the upgrade so Dependabot resumes reporting that line.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Node 20-alpine is the deployed runtime; the 25/26 jump is part of the
      # held upgrade program in #361 (align with the next LTS + CI matrix).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # CTR-P2-001: the app Dockerfiles and the prod compose pin base images by
  # digest; Dependabot scans per-directory, so each location needs its own
  # entry to keep the pins refreshed (weekly PRs).
  - package-ecosystem: "docker"
    directory: "/apps/api"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/apps/worker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/infra/digitalocean"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform/digitalocean"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "infra"
