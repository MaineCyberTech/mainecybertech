name: Unit tests and schema guards
description: >
  The coverage suite plus every repo guard (OpenAPI, docs counts/links, DB
  types, RLS hygiene, membership-predicate lint, migration transaction lint,
  required-check parity, branch-protection drift/bypass fixtures, review.md
  mirror). Shared by test.yml (PRs) and validate.yml (push deploy gate) so the
  two definitions cannot drift apart again.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run tests with coverage
      shell: bash
      run: pnpm test:coverage

    - name: Validate OpenAPI spec
      shell: bash
      run: pnpm --filter=api exec tsx src/scripts/validate-openapi.ts

    - name: OpenAPI coverage audit
      # Fails when a statically-resolvable Express route is missing from the
      # generated spec; dynamic factory routes are reported as warnings.
      shell: bash
      run: node scripts/openapi-audit.js

    - name: Check docs counts
      # Fails when README/AGENTS/INDEX state counts that have drifted from the
      # repo (web components, unit tests/suites, migrations, OpenAPI paths,
      # coverage thresholds). MCT_VERIFY_TEST_COUNTS=1 makes the per-package
      # test totals fail-closed against the .jest-results.json files the
      # coverage step above writes (TEST-P2-008).
      shell: bash
      env:
        MCT_VERIFY_TEST_COUNTS: "1"
      run: node scripts/check-docs-counts.mjs

    - name: Check docs links
      shell: bash
      run: node scripts/check-docs-links.mjs

    - name: Verify database types are current
      shell: bash
      run: node scripts/generate-db-types.js --check

    - name: Verify RLS/migration hygiene
      shell: bash
      run: node scripts/verify-rls.mjs

    - name: Verify no raw unfiltered membership predicate (DATA-P1-001)
      # Fails when a migration newer than the baseline reintroduces the
      # `memberships where user_id = auth.uid()` predicate without a
      # status='approved' filter, which let pending/suspended members read
      # tenant rows via the anon-key + JWT path.
      shell: bash
      run: node scripts/check-rls-predicate.mjs

    - name: Verify destructive migrations are transaction-wrapped (DATA-P2-002)
      # Fails when a migration contains `drop table` / `alter table ... drop
      # column` outside begin;/commit;. Under psql autocommit a mid-file
      # failure leaves the earlier drops committed, so the table-replacement
      # migrations can lose data on a partial apply. Also runs a negative
      # fixture through the detector so a broken guard cannot pass silently.
      shell: bash
      run: scripts/ci/check-migration-transactions.sh

    - name: Verify required branch-protection checks resolve (BP-P2-005)
      # Every required context in .github/branch-protection/*.json must be a
      # check-run name some workflow emits, and the emitting workflow's
      # pull_request trigger must not be path-filtered (a filtered required
      # check never reports on PRs that miss its paths - CI-P2-009). The
      # wrapper also runs a negative fixture, so a broken guard cannot pass
      # silently. Shared by the PR gate and the deploy gate.
      shell: bash
      run: scripts/ci/check-required-checks.sh

    - name: Verify the branch-protection drift/bypass detector (BP-P2-002/BP-P2-003)
      # Fixture-driven self-test for scripts/branch-protection-audit.mjs: the
      # scheduled audit must fail on a drifted or unprotected branch and on a
      # merged PR that missed/failed a required check, and pass on matching
      # fixtures, so a broken detector cannot pass silently.
      shell: bash
      run: scripts/ci/check-branch-protection-audit.sh

    - name: Verify review.md mirror is in sync
      shell: bash
      run: node scripts/sync-review-md.mjs --check

    - name: Verify store catalog copies are in sync (HYGIENE-P2-002)
      # apps/api/src/data/products.json is a generated mirror of the canonical
      # apps/web/lib/catalog/data/products.json; fail when a one-sided edit
      # makes the API fallback/seed serve different copy than the storefront.
      shell: bash
      run: node scripts/sync-product-catalog.mjs check

    - name: Verify no circular imports (HYGIENE-P3-009)
      # Fails when a static import/export/require edge closes a cycle across
      # apps/* and packages/*. The guard self-tests against a synthetic cycle
      # first so a broken detector cannot pass silently.
      shell: bash
      run: |
        node scripts/check-circular-deps.mjs --self-test
        node scripts/check-circular-deps.mjs
