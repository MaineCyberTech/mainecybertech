name: ShellCheck incident-path scripts
description: >
  Lint the deploy/backup/rollback scripts with shellcheck (preinstalled on the
  ubuntu runner). The manual rollback script shipped with an unbound
  GHCR_TOKEN reference, a non-fatal worker check and a wrong image prefix
  (INFRA-P2-006); this gate keeps the incident-path scripts statically clean.
  Shared by test.yml (PRs) and validate.yml (push deploy gate) so the two
  definitions cannot drift apart.

runs:
  using: composite
  steps:
    - name: ShellCheck incident-path scripts
      shell: bash
      # --severity=warning: notes/style are advisory; warnings/errors fail.
      run: |
        set -e
        shellcheck --version
        shellcheck --severity=warning \
          scripts/rollback.sh \
          scripts/backup-database.sh \
          scripts/backup-storage.sh \
          scripts/restore-database.sh \
          scripts/restore-storage.sh \
          scripts/terraform-state-restore.sh \
          scripts/ci/find-latest-backup.sh \
          scripts/ci/test-find-latest-backup.sh \
          scripts/ci/test-terraform-state-restore.sh \
          scripts/exercise-storage-restore.sh

    - name: Exercise restore backup discovery diagnostics
      shell: bash
      # DR-P3-008: negative fixture for a failing `aws s3 ls` (exit 254), an
      # empty reachable prefix and a successful newest-object pick.
      run: scripts/ci/test-find-latest-backup.sh
