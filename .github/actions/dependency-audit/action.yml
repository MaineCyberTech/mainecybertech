name: Dependency audit, license policy and Trivy
description: >
  Install dependencies (cached), enforce the dependency and license policies,
  then run the Trivy filesystem scan. Shared by test.yml's security-scan (PRs)
  and validate.yml's audit (push deploy gate).

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-pnpm

    - name: Audit all dependency scopes (policy gate)
      # SC-P1-001: blocks CRITICAL in any scope and HIGH+ in production, and
      # reports dev-tree advisories so they are visible. Policy:
      # security/dependency-audit-policy.json.
      shell: bash
      run: node scripts/audit-gate.mjs

    - name: License policy gate
      # SBOM-P1-001: allowlist + documented exceptions from
      # security/license-policy.json over the full resolved tree.
      # Uses scripts/collect-licenses.mjs, NOT `pnpm licenses list --json`,
      # which exits 1 on pnpm 10.34.x and writes an error document to stdout
      # (ERR_PNPM_MISSING_PACKAGE_INDEX_FILE).
      shell: bash
      run: |
        node scripts/collect-licenses.mjs --out licenses.json
        node scripts/license-gate.mjs licenses.json

    - name: Ensure generated license/SBOM artifacts stay untracked
      # HYG-P3-002 / INV-P2-001: `licenses.json` and `sbom.cdx.json` are
      # generated aggregates, listed in .gitignore and regenerated in CI (this
      # job and sbom.yml), never committed. Fail if one is committed again so a
      # stale copy cannot drift from the lockfile.
      shell: bash
      run: |
        tracked="$(git ls-files -- licenses.json sbom.cdx.json sbom.spdx.json)"
        if [ -n "$tracked" ]; then
          echo "::error::Generated artifacts must not be tracked: $tracked"
          exit 1
        fi
        echo "Generated artifacts are untracked (ok)"

    - name: Run Trivy filesystem vulnerability scanner
      # Dependency vulnerabilities are gated by audit-gate.mjs above; Trivy
      # focuses on source/config findings and Go/Rust binaries.
      uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-results.sarif
        exit-code: "1"
        ignore-unfixed: true
        severity: CRITICAL,HIGH
        skip-dirs: node_modules,.pnpm-store,dist,.next,coverage,prompts,apps/web/.next
        skip-files: pnpm-lock.yaml,package-lock.json,yarn.lock

    - name: Upload Trivy SARIF report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trivy-results
        path: trivy-results.sarif
        retention-days: 7
