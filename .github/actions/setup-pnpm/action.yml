name: Setup pnpm (cached)
description: >
  Setup Node, activate pnpm via corepack (with retries), restore the pnpm store
  cache, and optionally install dependencies. One definition for every
  workflow — the corepack/cache/install block used to be copy-pasted into
  ~10 jobs.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "20"
  install:
    description: Run `pnpm install --frozen-lockfile`
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        # corepack fetches pnpm from the npm registry; retry transient failures.
        ok=""
        for attempt in 1 2 3; do
          if corepack prepare pnpm@10 --activate; then ok=1; break; fi
          echo "corepack prepare failed (attempt $attempt/3)" >&2
          sleep 10
        done
        test -n "$ok"

    - name: Cache pnpm store
      # Content-addressed store; restore-keys give partial reuse when the
      # lockfile changes. Do NOT use setup-node's `cache: pnpm` — it resolves
      # pnpm before corepack installs it (see AGENTS.md).
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile
