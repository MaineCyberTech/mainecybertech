name: Secret scan (diff)
description: >
  Scan the push/PR diff for high-confidence secret patterns. Same patterns as
  scripts/scan-secrets.sh and the pre-commit hook. Requires a `fetch-depth: 0`
  checkout (the workflow does that before calling this action).

runs:
  using: composite
  steps:
    - name: Scan diff for secrets
      shell: bash
      run: |
        set -e
        PATTERNS='AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|gho_[0-9a-zA-Z]{36}|ghu_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z_]{22,}|sk_(live|test)_[0-9a-zA-Z]{16,}|xox[baprs]-[0-9a-zA-Z-]{10,}|-----BEGIN [A-Za-z ]*PRIVATE KEY-----|eyJhbGciOi[A-Za-z0-9_-]{10,}\.[A-Za-z0-9._-]{20,}\.[A-Za-z0-9._-]{20,}'
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          # CI-003: on a push, diff the pushed commit against the event's
          # before-SHA. Using `git merge-base HEAD origin/main` was a no-op on
          # pushes to main (origin/main == HEAD => empty diff), so the deploy
          # gate scanned nothing on the exact commit that ships to production.
          BASE="${{ github.event.before }}"
          # First push to a branch (or non-push event): before is all-zeros.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
        fi
        DIFF=$(git diff -U0 "$BASE" HEAD 2>/dev/null || git diff -U0 HEAD~1 HEAD)
        MATCHES=$(printf '%s' "$DIFF" | grep -E "^\+" | grep -v 'PATTERNS=' | grep -v 'secrets\.' | grep -vE "^\+\s*#" | grep -cE "$PATTERNS" || true)
        echo "Secret-pattern matches in diff: $MATCHES"
        if [ "$MATCHES" -gt 0 ]; then
          # SEC-001: never echo the matched line — it contains the secret and
          # GitHub retains workflow logs. Report only the affected files (from
          # the diff's `+++ b/<path>` headers); values stay masked.
          FILES=$(printf '%s' "$DIFF" | awk -v pat="$PATTERNS" '
            /^\+\+\+ b\// { f=substr($0,7) }
            /^\+/ && !/PATTERNS=/ && !/secrets\./ && !/^\+[[:space:]]*#/ && $0 ~ pat { print f }
          ' | sort -u | tr '\n' ' ')
          echo "::error::Secret pattern detected in diff (values redacted). Files: ${FILES:-unknown}"
          exit 1
        fi
