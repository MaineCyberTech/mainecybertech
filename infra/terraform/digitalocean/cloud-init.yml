#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - ufw

runcmd:
  # Enable Docker
  - systemctl enable docker
  - systemctl start docker

  # Create app directory
  - mkdir -p ${docker_compose_dir}
  - mkdir -p ${docker_compose_dir}/logs

  # Configure UFW
  # SSH is restricted to admin_ip_ranges (same allowlist as the DigitalOcean
  # firewall in firewall.tf). Default is 0.0.0.0/0 + ::/0 — set admin_ip_ranges
  # to office/VPN CIDRs in prod.tfvars/dev.tfvars for production. SSH is key-only.
  - ufw --force enable
%{ for cidr in admin_ip_ranges ~}
  - ufw allow from ${cidr} to any port 22 proto tcp
%{ endfor ~}
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  # NOTE: do NOT open 2376 (Docker daemon TCP). If dockerd is ever configured
  # for TCP that port is unauthenticated remote code execution.
