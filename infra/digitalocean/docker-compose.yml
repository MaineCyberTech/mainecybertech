name: mct-portal

x-security: &security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  NODE_ENV: production
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
  JWT_SECRET: ${JWT_SECRET}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  APP_BASE_URL: https://${APP_DOMAIN:-app.mainecybertech.com}

services:
  # ===== Queue =====
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    <<: *security
    # CHANGE THE REDIS_PASSWORD env var in production to a strong random value
    command: redis-server --requirepass ${REDIS_PASSWORD:-mct_redis_changeme_in_production}
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 48m
    read_only: true
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mct_redis_changeme_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Our Apps =====
  api:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-api:${IMAGE_TAG:-latest}
    <<: *security
    environment:
      <<: *app-env
      API_PORT: 4000
      LOG_LEVEL: info
      REDIS_URL: redis://:${REDIS_PASSWORD:-mct_redis_changeme_in_production}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mct_redis_changeme_in_production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_TRAFFIC_WEBHOOK_URL: ${PUBLIC_TRAFFIC_WEBHOOK_URL:-}
      PUBLIC_LEAD_WEBHOOK_URL: ${PUBLIC_LEAD_WEBHOOK_URL:-}
      JSM_DOMAIN: ${JSM_DOMAIN:-}
      JSM_EMAIL: ${JSM_EMAIL:-}
      JSM_API_TOKEN: ${JSM_API_TOKEN:-}
      JSM_SERVICEDESK_ID: ${JSM_SERVICEDESK_ID:-}
      JSM_REQUEST_TYPE_ID: ${JSM_REQUEST_TYPE_ID:-}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    tmpfs:
      - /tmp
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-worker:${IMAGE_TAG:-latest}
    <<: *security
    environment:
      <<: *app-env
      LOG_LEVEL: info
      HEALTH_PORT: 3001
      QUEUE_BACKEND: bullmq
      REDIS_URL: redis://:${REDIS_PASSWORD:-mct_redis_changeme_in_production}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-mct_redis_changeme_in_production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JSM_BASE_URL: ${JSM_BASE_URL:-}
      JSM_EMAIL: ${JSM_EMAIL:-}
      JSM_API_TOKEN: ${JSM_API_TOKEN:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mainecybertech.com}
      API_BASE_URL: https://${API_DOMAIN:-api.mainecybertech.com}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    tmpfs:
      - /tmp
    read_only: true

  web:
    image: ${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-web:${IMAGE_TAG:-latest}
    <<: *security
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: 1
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m

  # ===== Reverse Proxy =====
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    <<: *security
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped
    mem_limit: 64m

volumes:
  redis-data:
  caddy-data:
  caddy-config:
