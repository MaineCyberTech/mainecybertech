name: mct-portal

x-security: &security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  NODE_ENV: production
  SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY must be set}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  APP_BASE_URL: https://${APP_DOMAIN:-app.mainecybertech.com}
  # ARCH-P2-004: ONE queue backend contract for the API producer and the
  # worker consumer. Both services read this value and both refuse to start in
  # production on anything but bullmq, so the two sides cannot drift apart
  # (the API can only enqueue to BullMQ).
  QUEUE_BACKEND: ${QUEUE_BACKEND:-bullmq}

# Bound container logs so the droplet's disk cannot fill up. Deploy-do also
# snapshots the running stack's logs before `compose down` destroys them
# (OBS-P2-015); see docs/MONITORING_AND_ALERTING.md > Application-Level Logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===== Queue =====
  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    logging: *default-logging
    <<: *security
    read_only: false
    # The official redis entrypoint drops privileges to `redis`; ours replaces
    # it (CTR-P2-003, password off argv), so run as `redis` directly. As root
    # with `cap_drop: ALL` the container lacks CAP_DAC_OVERRIDE and cannot read
    # the redis-owned (0600) /data/dump.rdb (deploy 2026-10-03). The SETUID/
    # SETGID caps the official entrypoint needed are therefore not added.
    user: redis
    # REDIS_PASSWORD is REQUIRED (no fallback) — set it in .env or the environment.
    # The password is written to a 0600 file by the entrypoint and passed via the
    # ENVIRONMENT only: `--requirepass ${REDIS_PASSWORD}` on the command line (the
    # previous form) exposed it in argv, readable by any host process via `ps`.
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      # INFRA-P3-003: persistence is RDB-snapshot only (no AOF) — this is a
      # deliberate decision recorded in docs/RTO_RPO.md (Redis RPO 24h);
      # in-flight BullMQ work is re-driven by producers/retries after a loss.
      - redis-data:/data
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 48m
    # Fork-bomb blast radius (CTR-P2-005): without a PID cap one container can
    # exhaust the host PID table and take down every service on this
    # single-droplet topology.
    pids_limit: 128
    healthcheck:
      # Authenticate via REDISCLI_AUTH (env), not `-a <password>` (argv).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== Our Apps =====
  # App images are built+tagged by CI with the immutable commit SHA. The deploy
  # workflow resolves each tag to its manifest digest, verifies the build
  # provenance AND CycloneDX SBOM attestations for that digest, then passes the
  # digest here via MCT_<SERVICE>_IMAGE so the pull/run uses `@sha256:...`
  # instead of the mutable tag (SBOM-P2-011; see docs/CI.md > "Provenance
  # verification at deploy"). The tag-based fallback exists only for manual
  # operator runs (`IMAGE_TAG=<sha> docker compose up -d`).
  api:
    image: ${MCT_API_IMAGE:-${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-api:${IMAGE_TAG:?IMAGE_TAG must be set}}
    logging: *default-logging
    <<: *security
    environment:
      <<: *app-env
      API_PORT: 4000
      LOG_LEVEL: info
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # OBS-P3-004: tag API errors/transactions with the deployed commit. The
      # deploy writes SENTRY_RELEASE (the image tag / commit SHA) to the droplet
      # .env; without it release correlation falls back to nothing.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # PII field encryption (AES-256-GCM). Without this the dev `plain:`
      # fallback is used, so set it in production.
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      # Cloudflare Turnstile: when the secret is set, /public/submit requires a
      # valid captcha token (the site key is inlined into the web build).
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      # Upload malware scanning (FILE-P2-003). Unset = no-op; point at a
      # ClamAV sidecar or a VirusTotal proxy (see docs/features/secure-file-request.md).
      MALWARE_SCANNER_URL: ${MALWARE_SCANNER_URL:-}
      MALWARE_SCANNER_API_KEY: ${MALWARE_SCANNER_API_KEY:-}
      # Prometheus /metrics bearer gate (unset => token gate disabled).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      MFA_ENFORCEMENT_ENABLED: ${MFA_ENFORCEMENT_ENABLED:-false}
      M365_CLIENT_STATE: ${M365_CLIENT_STATE:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:-}
      JSM_WEBHOOK_SECRET: ${JSM_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mainecybertech.com}
      # Web Push (NOTIF-P2-001): the API only needs the public key it hands to
      # browsers; unset = the push channel is disabled.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      PUBLIC_TRAFFIC_WEBHOOK_URL: ${PUBLIC_TRAFFIC_WEBHOOK_URL:-}
      PUBLIC_LEAD_WEBHOOK_URL: ${PUBLIC_LEAD_WEBHOOK_URL:-}
      JSM_DOMAIN: ${JSM_DOMAIN:-}
      JSM_EMAIL: ${JSM_EMAIL:-}
      JSM_API_TOKEN: ${JSM_API_TOKEN:-}
      JSM_SERVICEDESK_ID: ${JSM_SERVICEDESK_ID:-}
      JSM_REQUEST_TYPE_ID: ${JSM_REQUEST_TYPE_ID:-}
      # RLS gating enabler (MT-P0-001). Empty by default => getScopedClient
      # stays on the service-role client (current behavior). Set via GitHub
      # secrets RLS_READS_ENABLED / RLS_WRITES_ENABLED to flip per module.
      RLS_READS_ENABLED: ${RLS_READS_ENABLED:-}
      RLS_WRITES_ENABLED: ${RLS_WRITES_ENABLED:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    # Fork-bomb blast radius (CTR-P2-005). CPU limits are deliberately not set:
    # the dev droplet is 1 vCPU, so per-service `cpus` caps would throttle the
    # shared box rather than isolate it.
    pids_limit: 256
    tmpfs:
      - /tmp
    read_only: true
    # RES-P2-009: the worker drains in-flight jobs for up to
    # WORKER_SHUTDOWN_TIMEOUT_MS (default 30s). Docker's default 10s stop
    # timeout SIGKILLs it before that, so give the app services a grace period
    # larger than the drain budget.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # CTR-P3-001: don't count boot-time failures against the retries budget.
      start_period: 30s

  worker:
    image: ${MCT_WORKER_IMAGE:-${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-worker:${IMAGE_TAG:?IMAGE_TAG must be set}}
    logging: *default-logging
    <<: *security
    environment:
      <<: *app-env
      LOG_LEVEL: info
      HEALTH_PORT: 3001
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # OBS-P3-004: same release marker as the API, so worker task failures and
      # API errors can be correlated to the same deploy.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JSM_BASE_URL: ${JSM_BASE_URL:-}
      JSM_EMAIL: ${JSM_EMAIL:-}
      JSM_API_TOKEN: ${JSM_API_TOKEN:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      # Needed to decrypt outbound webhook signing secrets at rest (WH-P2-008).
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@mainecybertech.com}
      # Web Push (NOTIF-P2-001): the worker holds the private key and subject
      # and does the VAPID signing; unset (or partial) = push is a no-op.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # ARCH-P3-005: worker /metrics is gated with the same token as the API;
      # Prometheus sends it (see prometheus.yml). Unset => /metrics 404s.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      API_BASE_URL: https://${API_DOMAIN:-api.mainecybertech.com}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    # Fork-bomb blast radius (CTR-P2-005). CPU limits are deliberately not set:
    # the dev droplet is 1 vCPU, so per-service `cpus` caps would throttle the
    # shared box rather than isolate it.
    pids_limit: 256
    tmpfs:
      - /tmp
    read_only: true
    # RES-P2-009: align the container stop budget with the worker's drain
    # watchdog (WORKER_SHUTDOWN_TIMEOUT_MS, default 30s). Without this Docker
    # SIGKILLs the worker at its 10s default mid-drain, so in-flight jobs are
    # killed and redelivered.
    stop_grace_period: 60s
    # Liveness probe on the worker's HEALTH_PORT (audit IR-P1-003). Without
    # this, `docker inspect` reports "missing" and the deploy's container
    # health gate cannot confirm the worker — enabling it lets a worker that
    # never becomes healthy fail the gate and trigger the auto-revert.
    healthcheck:
      # 127.0.0.1, not `localhost`: the health server binds 0.0.0.0 (IPv4) and
      # BusyBox wget resolves `localhost` to ::1 first, so the probe failed and
      # the container was marked unhealthy (deploy 2026-10-03).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # CTR-P3-001: allow the consumer/health server to boot before counting
      # failures against the retries budget.
      start_period: 30s

  web:
    image: ${MCT_WEB_IMAGE:-${GHCR_IMAGE_PREFIX:-ghcr.io/mainecybertech/mainecybertech}/mct-web:${IMAGE_TAG:?IMAGE_TAG must be set}}
    logging: *default-logging
    <<: *security
    environment:
      NODE_ENV: production
      # ARCH-P3-003: server-side runtime API URL. NEXT_PUBLIC_* is inlined at
      # build time, so the server cannot be redirected with the compose value
      # below; API_INTERNAL_URL is read at request time by lib/api.ts and keeps
      # SSR traffic on the docker network instead of the public edge.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: 1
      # OBS-P2-011: the web Sentry configs read NEXT_PUBLIC_SENTRY_DSN, not
      # SENTRY_DSN. The build arg inlines it into the client bundle; this
      # runtime copy covers the standalone server. Both come from the deploy.
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # OBS-P3-004: server-side Sentry release marker for the deployed commit
      # (the client bundle keeps its build-time NEXT_PUBLIC_GIT_SHA).
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache

  # ===== Observability (internal only — no published ports) =====
  # Host metrics (CPU, memory, root filesystem, load). Before this the local
  # stack had no host signal at all: the 2026-10-15 review found the dev
  # droplet at 98% disk (615 MB free) with every service-level rule green.
  # Internal only — no published ports; the series are host resource data, not
  # tenant data, so Prometheus scrapes this one without a token (unlike the
  # API/worker /metrics endpoints).
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    logging: *default-logging
    <<: *security
    volumes:
      # Host procfs/sysfs/rootfs, read-only. The bind-mounted procfs exposes
      # the host's /proc/1/mounts, which is where the filesystem collector
      # reads the real mount table from.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Root filesystem and real mounts only; the container runtime's overlay
      # mounts and pseudo-filesystems would otherwise dominate the series.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($|/)
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 64m
    # Fork-bomb blast radius (CTR-P2-005), same as every other service.
    pids_limit: 128
    read_only: true
    healthcheck:
      # The official node-exporter image is scratch-based: there is no shell
      # and no wget/curl. Probe the binary itself instead of the HTTP endpoint.
      test: ["CMD", "/bin/node_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    logging: *default-logging
    <<: *security
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yml:/etc/prometheus/rules.yml:ro
      # METRICS_TOKEN, written 0600 by the deploy, for the authenticated
      # mct-api scrape (the API 404s unauthenticated /metrics requests).
      - ./metrics-token:/etc/prometheus/metrics-token:ro
      # Named volume (not tmpfs): TSDB must survive restarts/deploys or the 30d
      # retention window is lost on every compose down/up. tmpfs also blew the
      # 256MB mem_limit. Disk is cheap; metrics history is not.
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      alertmanager:
        condition: service_healthy
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 256m
    # Fork-bomb blast radius (CTR-P2-005). CPU limits are deliberately not set:
    # the dev droplet is 1 vCPU, so per-service `cpus` caps would throttle the
    # shared box rather than isolate it.
    pids_limit: 256
    read_only: true
    # INFRA-P2-007: prometheus had no healthcheck, so the deploy gate could
    # not assert it. /-/ready returns 200 once the TSDB is ready to serve.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Alertmanager — alert DELIVERY + the dead-man's switch (IR-P0-003).
  # Prometheus forwards firing alerts here (see prometheus.yml `alerting:`).
  # The Watchdog rule is routed to an EXTERNAL receiver (a healthchecks.io-style
  # ping URL / external webhook), so a total loss of this droplet is still
  # detected off-box. Internal only — no published ports.
  alertmanager:
    # TODO(ops): digest is pinned to the v0.28.1 manifest-list digest. If a newer
    # release is adopted, re-pin (`docker buildx imagetools inspect
    # prom/alertmanager:vX.Y.Z`) and update the digest here before merge.
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    logging: *default-logging
    <<: *security
    environment:
      # Substituted into alertmanager.yml by envsubst at container start. Never
      # commit real values - set these in the droplet .env / GitHub env secrets.
      # REQUIRED for the dead-man's switch to actually reach off-box:
      #   ALERTMANAGER_WATCHDOG_WEBHOOK_URL, ALERTMANAGER_CRITICAL_WEBHOOK_URL
      ALERTMANAGER_WATCHDOG_WEBHOOK_URL: ${ALERTMANAGER_WATCHDOG_WEBHOOK_URL:-http://127.0.0.1:1/noop}
      ALERTMANAGER_CRITICAL_WEBHOOK_URL: ${ALERTMANAGER_CRITICAL_WEBHOOK_URL:-http://127.0.0.1:1/noop}
      ALERTMANAGER_DEFAULT_WEBHOOK_URL: ${ALERTMANAGER_DEFAULT_WEBHOOK_URL:-http://127.0.0.1:1/noop}
      ALERTMANAGER_SLACK_API_URL: ${ALERTMANAGER_SLACK_API_URL:-http://127.0.0.1:1/noop}
      ALERTMANAGER_SLACK_CHANNEL: ${ALERTMANAGER_SLACK_CHANNEL:-#alerts}
      # Basic-auth credentials for the critical/default webhooks (ntfy relay
      # user). Non-empty placeholders keep the rendered config valid when the
      # receivers point at the no-op loopback URL; real values arrive from the
      # droplet .env / GitHub environment secrets.
      ALERTMANAGER_WEBHOOK_USER: ${ALERTMANAGER_WEBHOOK_USER:-unset}
      ALERTMANAGER_WEBHOOK_PASS: ${ALERTMANAGER_WEBHOOK_PASS:-unset}
    volumes:
      # Mounted READ-ONLY as a template. Alertmanager has no shell-style variable
      # substitution of its own (a literal ${VAR} in a url: fails validation with
      # "first path segment in URL cannot contain colon"), and the image has no
      # envsubst (alpine/busybox). The entrypoint renders the template with the
      # awk renderer below into a writable path, fails loudly if any placeholder
      # survives, then hands off to alertmanager.
      - ./alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      # OBS-P3-005: renderer that substitutes the placeholders with index/substr
      # (not gsub, whose replacement string treats "&" and "\" specially) and
      # escapes each value for the double-quoted YAML scalar it lands in, so a
      # secret containing "&", "\" or '"' cannot corrupt the rendered config.
      - ./render-alertmanager.awk:/etc/alertmanager/render-alertmanager.awk:ro
      # Alertmanager keeps its notification/silence state here; a named volume
      # survives restarts so a deploy does not re-fire duplicate notifications.
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        awk -f /etc/alertmanager/render-alertmanager.awk /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
        && ! grep -E '\$\{ALERTMANAGER' /tmp/alertmanager.yml | grep -vE '^[[:space:]]*#' | grep -q .
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
        --storage.path=/alertmanager --log.level=info
    expose:
      - "9093"
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===== Reverse Proxy =====
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    logging: *default-logging
    <<: *security
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # CTR-P3-003: read-only config. Without `:ro` a process inside caddy
      # could rewrite the host-side /opt/mct-portal/Caddyfile (TLS termination
      # for every user) and the change would survive restarts/redeploys.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    healthcheck:
      # `caddy validate` catches a broken Caddyfile deterministically; probing
      # HTTP would flap on the 80 -> 443 redirect (self-signed/TLS internal).
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 128
    # CTR-P3-003: no writable rootfs. Caddy's state lives in the caddy-data /
    # caddy-config volumes; /tmp is the only writable path a compromised
    # process gets (matching api/web/prometheus/alertmanager).
    read_only: true
    tmpfs:
      - /tmp

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  prom-data:
  alertmanager-data:
