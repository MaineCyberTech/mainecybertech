# promtool unit tests for prometheus.rules.yml (IR-P1-006, IR-P2-002/003,
# IR-P2-010, NOTIF-P1-003, OBS-P2-005/006/009/012, MT-P2-005, WH-P2-010).
#
# Run from the repo root (CI does this in .github/actions/prometheus-rules):
#   PROM_IMAGE=prom/prometheus:v3.5.1@sha256:4b05278adfb2e2781063781edd7ca88cc649ea5270cea1696618886a37eeb298
#   docker run --rm -v "$PWD/infra/digitalocean:/cfg:ro" --entrypoint /bin/promtool \
#     "$PROM_IMAGE" check rules /cfg/prometheus.rules.yml
#   docker run --rm -v "$PWD/infra/digitalocean:/cfg:ro" --entrypoint /bin/promtool \
#     "$PROM_IMAGE" test rules /cfg/prometheus.rules.test.yml
#
# These exist because `promtool check rules` only validates SYNTAX. The first
# version of MCTTenantScopeRegression passed check rules and could never fire
# (clamp_min used as a cap pushed the threshold above 1.0); the second used a
# self-referential 24h baseline that the ongoing spike raised, silencing it. Both
# are caught here and neither is caught by a syntax check. Keep these cases in
# sync with the rules - a rule that cannot fire is worse than no rule.
rule_files:
  - /cfg/prometheus.rules.yml

evaluation_interval: 1m

tests:
  # CASE 1: sustained >=50% org-less on a busy module MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="true"}'
        values: '0+60x120'
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="false"}'
        values: '0+60x120'
    alert_rule_test:
      - eval_time: 40m
        alertname: MCTTenantScopeRegression
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              module: tickets
            exp_annotations:
              summary: "Module tickets started serving tenant data with no organization scope"
              description: "At least half of the RLS-bypassing client selections for module tickets resolve no organization. That is the signature of a tenant-isolation regression - a query that dropped its organization_id predicate. Confirm whether this module has a genuine platform-level read path before treating it as benign; check its queries for a missing organization_id filter."

  # CASE 2: a module that is fully org-resolved MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="true"}'
        values: '0+60x120'
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="false"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 40m
        alertname: MCTTenantScopeRegression
        exp_alerts: []

  # CASE 3: low org-less share (below 50%) MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="true"}'
        values: '0+60x120'
      - series: 'portal_rls_bypass_total{module="tickets",kind="read",org_resolved="false"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 40m
        alertname: MCTTenantScopeRegression
        exp_alerts: []

  # CASE 4: MCTRlsEnforcedShareCollapsed - a module that WAS enforcing in the
  # last 6h drops to zero while still serving traffic.
  - interval: 1m
    input_series:
      # enforcing until t=300m, then flat
      - series: 'portal_rls_enforced_total{module="documents",kind="read"}'
        values: '0+60x300 18000+0x300'
      - series: 'portal_rls_bypass_total{module="documents",kind="read",org_resolved="true"}'
        values: '0+60x600'
    alert_rule_test:
      - eval_time: 9h
        alertname: MCTRlsEnforcedShareCollapsed
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              module: documents
            exp_annotations:
              summary: "Module documents stopped serving through the RLS-enforcing client"
              description: "Module documents previously served tenant queries through the RLS-enforcing client but has produced none for 30 minutes while still handling traffic. It likely dropped out of RLS_READS_ENABLED / RLS_WRITES_ENABLED. Check the allow-lists in the droplet .env."

  # CASE 5: a module that NEVER enforced must stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_rls_enforced_total{module="neverrls",kind="read"}'
        values: '0+0x1800'
      - series: 'portal_rls_bypass_total{module="neverrls",kind="read",org_resolved="true"}'
        values: '0+60x1800'
    alert_rule_test:
      - eval_time: 29h
        alertname: MCTRlsEnforcedShareCollapsed
        exp_alerts: []

  # CASE 6: MCTHighRequestLatency (OBS-P2-009) - p95 in the (2s,5s] bucket
  # MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_http_request_duration_seconds_bucket{le="1"}'
        values: '0+0x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="2"}'
        values: '0+0x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="5"}'
        values: '0+6000x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+6000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTHighRequestLatency
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
            exp_annotations:
              summary: "MCT API p95 latency above 2s"
              description: "API p95 request latency has been above 2 seconds for 10 minutes (SLO #2). Check the dashboard and recent deploys."

  # CASE 7: p95 under 2s MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_http_request_duration_seconds_bucket{le="1"}'
        values: '0+0x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="2"}'
        values: '0+6000x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="5"}'
        values: '0+6000x60'
      - series: 'portal_http_request_duration_seconds_bucket{le="+Inf"}'
        values: '0+6000x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTHighRequestLatency
        exp_alerts: []

  # CASE 8: MCTCircuitBreakerOpen (OBS-P2-009) - status 2 (open) MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_circuit_breaker_status{name="supabase"}'
        values: '2+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTCircuitBreakerOpen
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              name: supabase
            exp_annotations:
              summary: "Circuit breaker supabase is open"
              description: "Circuit breaker supabase has been open for 5 minutes: calls through it are failing fast. Check the dependency health and recent error logs."

  # CASE 9: a half-open breaker MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_circuit_breaker_status{name="supabase"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTCircuitBreakerOpen
        exp_alerts: []

  # CASE 10: MCTAuthFailureRateHigh (OBS-P2-009) - sustained >50% failures
  # with volume MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_auth_attempts_total{result="success"}'
        values: '0+1x120'
      - series: 'portal_auth_attempts_total{result="failure"}'
        values: '0+4x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTAuthFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
            exp_annotations:
              summary: "MCT authentication failure ratio above 50%"
              description: "More than half of authentication attempts have failed for 10 minutes (at least 3 failures/minute). This can be credential stuffing/brute force or a broken login path - review the auth logs."

  # CASE 11: a low failure ratio MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_auth_attempts_total{result="success"}'
        values: '0+10x120'
      - series: 'portal_auth_attempts_total{result="failure"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTAuthFailureRateHigh
        exp_alerts: []

  # CASE 12: MCTImpersonationActivity (IR-P2-002 / OBS-P2-005 / MT-P2-005) -
  # a single privileged event MUST fire (low-volume companion to the burst
  # rule).
  - interval: 1m
    input_series:
      - series: 'portal_impersonation_events_total{actor_role_key="admin",source="api"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: MCTImpersonationActivity
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              actor_role_key: admin
              source: api
            exp_annotations:
              summary: "Cross-tenant (impersonation) access by admin from api"
              description: "A cross-tenant access event was recorded in the last 15 minutes (role admin, source api). Review GET /api/v1/audit/impersonation and confirm the access was expected."

  # CASE 13: no impersonation events MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_impersonation_events_total{actor_role_key="admin",source="api"}'
        values: '0+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: MCTImpersonationActivity
        exp_alerts: []

  # CASE 14: MCTWebhookDeadLettersAccumulating (IR-P2-003 / OBS-P2-006 /
  # WH-P2-010) - an API dead letter MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_webhook_dead_letters_total{event="ticket.created",job="mct-api"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWebhookDeadLettersAccumulating
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              event: ticket.created
              job: mct-api
            exp_annotations:
              summary: "Webhook deliveries moved to the dead-letter set (ticket.created)"
              description: "One or more outbound webhook deliveries for event ticket.created exhausted their retries in the last hour. Check the dead-letter store and replay once the receiver is healthy."

  # CASE 15: a worker dead letter MUST fire too (the `or` right branch).
  - interval: 1m
    input_series:
      - series: 'worker_webhook_dead_letters_total{event="invoice.paid",job="mct-worker"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWebhookDeadLettersAccumulating
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              event: invoice.paid
              job: mct-worker
            exp_annotations:
              summary: "Webhook deliveries moved to the dead-letter set (invoice.paid)"
              description: "One or more outbound webhook deliveries for event invoice.paid exhausted their retries in the last hour. Check the dead-letter store and replay once the receiver is healthy."

  # CASE 16: zero dead letters MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_webhook_dead_letters_total{event="ticket.created",job="mct-api"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWebhookDeadLettersAccumulating
        exp_alerts: []

  # CASE 17: MCTWebhookDeliveryFailureRateHigh (WH-P2-010) - >50% failures
  # MUST fire (critical).
  - interval: 1m
    input_series:
      - series: 'portal_webhook_deliveries_total{status="success",event="ticket.created",job="mct-api"}'
        values: '0+1x120'
      - series: 'portal_webhook_deliveries_total{status="failed",event="ticket.created",job="mct-api"}'
        values: '0+2x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWebhookDeliveryFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              job: mct-api
            exp_annotations:
              summary: "Webhook delivery failure ratio above 50% (mct-api)"
              description: "More than half of outbound webhook deliveries on mct-api have failed for 15 minutes. Consumers are missing events; check the delivery error logs and the receiver endpoints."

  # CASE 18: the worker-side >50% ratio MUST fire too (the `or` right branch).
  - interval: 1m
    input_series:
      - series: 'worker_webhook_deliveries_total{status="success",event="invoice.paid",job="mct-worker"}'
        values: '0+1x120'
      - series: 'worker_webhook_deliveries_total{status="failed",event="invoice.paid",job="mct-worker"}'
        values: '0+2x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWebhookDeliveryFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              job: mct-worker
            exp_annotations:
              summary: "Webhook delivery failure ratio above 50% (mct-worker)"
              description: "More than half of outbound webhook deliveries on mct-worker have failed for 15 minutes. Consumers are missing events; check the delivery error logs and the receiver endpoints."

  # CASE 19: a low failure ratio MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_webhook_deliveries_total{status="success",event="ticket.created",job="mct-api"}'
        values: '0+10x120'
      - series: 'portal_webhook_deliveries_total{status="failed",event="ticket.created",job="mct-api"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWebhookDeliveryFailureRateHigh
        exp_alerts: []

  # CASE 20: MCTNotificationDeliveryFailureRateHigh (NOTIF-P1-003) - >5%
  # email failures MUST fire.
  - interval: 1m
    input_series:
      - series: 'worker_notification_delivery_total{channel="email",status="success",job="mct-worker"}'
        values: '0+9x180'
      - series: 'worker_notification_delivery_total{channel="email",status="failed",job="mct-worker"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: MCTNotificationDeliveryFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              channel: email
              job: mct-worker
            exp_annotations:
              summary: "Notification delivery failures above 5% (email)"
              description: "More than 5% of email deliveries on mct-worker have failed for 30 minutes. Check SMTP/provider errors; recipients are not being notified."

  # CASE 21: the API-side >5% ratio MUST fire too (the `or` right branch).
  - interval: 1m
    input_series:
      - series: 'portal_notification_delivery_total{channel="in_app",status="success",job="mct-api"}'
        values: '0+9x180'
      - series: 'portal_notification_delivery_total{channel="in_app",status="failed",job="mct-api"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: MCTNotificationDeliveryFailureRateHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              channel: in_app
              job: mct-api
            exp_annotations:
              summary: "Notification delivery failures above 5% (in_app)"
              description: "More than 5% of in_app deliveries on mct-api have failed for 30 minutes. Check SMTP/provider errors; recipients are not being notified."

  # CASE 22: failures below 5% MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_notification_delivery_total{channel="email",status="success",job="mct-worker"}'
        values: '0+100x180'
      - series: 'worker_notification_delivery_total{channel="email",status="failed",job="mct-worker"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 45m
        alertname: MCTNotificationDeliveryFailureRateHigh
        exp_alerts: []

  # CASE 23: MCTNotificationEmailSkipped (NOTIF-P1-003) - a skipped email
  # (SMTP unset) MUST fire.
  - interval: 1m
    input_series:
      - series: 'portal_notification_delivery_total{channel="email",status="skipped",job="mct-api"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTNotificationEmailSkipped
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              channel: email
              status: skipped
              job: mct-api
            exp_annotations:
              summary: "Notification emails are being skipped"
              description: "At least one email delivery was skipped in the last hour because SMTP is not configured. Recipients are silently not receiving email notifications - check the SMTP_* environment."

  # CASE 24: no skipped emails MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_notification_delivery_total{channel="email",status="success",job="mct-api"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTNotificationEmailSkipped
        exp_alerts: []

  # CASE 25: MCTWorkerTaskFailures (OBS-P2-009) - a failing task type MUST fire.
  - interval: 1m
    input_series:
      - series: 'worker_task_executions_total{task_type="send-email",status="failure"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              task_type: send-email
            exp_annotations:
              summary: "Worker task send-email is failing"
              description: "Task type send-email has recorded failure/error/timeout/no_handler executions for 10 minutes. Check the worker logs for send-email."

  # CASE 26: no_handler MUST fire as well (a task type this build cannot run).
  - interval: 1m
    input_series:
      - series: 'worker_task_executions_total{task_type="unknown.task",status="no_handler"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              task_type: unknown.task
            exp_annotations:
              summary: "Worker task unknown.task is failing"
              description: "Task type unknown.task has recorded failure/error/timeout/no_handler executions for 10 minutes. Check the worker logs for unknown.task."

  # CASE 27: successful executions MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_task_executions_total{task_type="send-email",status="success"}'
        values: '0+10x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskFailures
        exp_alerts: []

  # CASE 28: MCTWorkerQueueBacklog (OBS-P2-009) - a sustained backlog MUST fire.
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="mct-tasks"}'
        values: '80+0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTWorkerQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              queue: mct-tasks
            exp_annotations:
              summary: "Worker task queue backlog above 50"
              description: "More than 50 tasks have been waiting/active in the BullMQ queue for 15 minutes. Tasks are not draining - check worker health, Redis latency and the failing task types."

  # CASE 29: a small queue MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="mct-tasks"}'
        values: '5+0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTWorkerQueueBacklog
        exp_alerts: []

  # CASE 30: the queue="unavailable" series is deliberately NOT alertable (the
  # worker sets the gauge to 0 and never clears it, and it is also set when the
  # queue is disabled by config).
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="unavailable"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: MCTWorkerQueueBacklog
        exp_alerts: []

  # CASE 31: BILL-P2-003 - any new reconciliation drift MUST fire.
  - interval: 1m
    input_series:
      - series: 'worker_stripe_reconcile_drift_total{kind="subscription_status"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTStripeReconcileDrift
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              kind: subscription_status
            exp_annotations:
              summary: "Stripe reconciliation detected billing drift"
              description: "The stripe-reconcile task found at least one mirror-vs-Stripe mismatch in the last 25 hours (subscription status, invoice count/sum, or payment count/sum). Check the worker logs for the organization and drift kind, then compare the local billing mirror with Stripe."

  # CASE 32: a clean reconciliation (no drift) MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_stripe_reconcile_drift_total{kind="subscription_status"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTStripeReconcileDrift
        exp_alerts: []

  # CASE 33: a queue that stays disconnected MUST fire MCTWorkerQueueDisconnected.
  - interval: 1m
    input_series:
      - series: 'worker_queue_connected'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTWorkerQueueDisconnected
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
            exp_annotations:
              summary: "MCT worker lost its BullMQ (Redis) queue connection"
              description: "worker_queue_connected has been 0 for 5 minutes: the worker cannot consume queued tasks, and scheduled tasks fall back to direct execution. Check Redis (docker compose ps redis) and the worker logs; the worker container also reports unhealthy on /health."

  # CASE 34: a connected queue MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_queue_connected'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: MCTWorkerQueueDisconnected
        exp_alerts: []

  # CASE 35: a backlog growing faster than the consumer drains it MUST fire
  # MCTWorkerQueueBacklogGrowing, even while it is below the absolute
  # MCTWorkerQueueBacklog threshold.
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="mct-tasks"}'
        values: '0+5x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWorkerQueueBacklogGrowing
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              queue: mct-tasks
            exp_annotations:
              summary: "MCT worker task queue backlog is growing"
              description: "worker_task_queue_depth for mct-tasks is above 20 and has grown by more than 25 jobs over 10 minutes, sustained for 10 minutes. Arrivals are outpacing the consumer - check the worker logs, Redis latency and worker concurrency."

  # CASE 36: a large FLAT backlog MUST stay quiet on the growth rule - that
  # shape is covered by the absolute MCTWorkerQueueBacklog rule (CASE 28).
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="mct-tasks"}'
        values: '150+0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWorkerQueueBacklogGrowing
        exp_alerts: []

  # CASE 37: a small flat backlog MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_task_queue_depth{queue="mct-tasks"}'
        values: '5+0x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: MCTWorkerQueueBacklogGrowing
        exp_alerts: []

  # CASE 38: a timed-out execution MUST fire MCTWorkerTaskFailures (RES-P2-002).
  - interval: 1m
    input_series:
      - series: 'worker_task_executions_total{task_type="retention",status="timeout"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              task_type: retention
            exp_annotations:
              summary: "Worker task retention is failing"
              description: "Task type retention has recorded failure/error/timeout/no_handler executions for 10 minutes. Check the worker logs for retention."

  # CASE 39: any dead-lettered task MUST fire MCTWorkerTaskDeadLettered (RES-P2-002).
  - interval: 1m
    input_series:
      - series: 'worker_task_dead_letters_total{task_type="retention"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskDeadLettered
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              task_type: retention
            exp_annotations:
              summary: "Worker task retention exhausted its retries"
              description: "At least one retention task failed every retry attempt in the last 15 minutes and was written to task_dead_letters. It is no longer in the queue. Inspect the row (task_type, payload, error) and replay or fix the handler."

  # CASE 40: no dead letters MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'worker_task_dead_letters_total{task_type="retention"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTWorkerTaskDeadLettered
        exp_alerts: []

  # CASE 41: an API Redis probe failing for >5m MUST fire MCTApiRedisDegraded
  # (ARCH-P2-005) - the API stays up on its in-memory fallback, so this gauge
  # is the only alertable signal.
  - interval: 1m
    input_series:
      - series: 'portal_redis_connected{job="mct-api"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTApiRedisDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              job: mct-api
            exp_annotations:
              summary: "MCT API Redis health probe is failing"
              description: "The API's Redis probe has failed for 5 minutes. The response cache and idempotency dedup have degraded to per-process memory: duplicate side effects become possible and cache entries are no longer shared across processes. The API intentionally stays up (fail-open for availability) - check the redis container and follow docs/PLATFORM_FAILURE_RUNBOOKS.md section 1."

  # CASE 42: a healthy API Redis probe MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_redis_connected{job="mct-api"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTApiRedisDegraded
        exp_alerts: []

  # CASE 43: API Redis fallbacks MUST fire MCTRedisOperationFailures
  # (ARCH-P2-005).
  - interval: 1m
    input_series:
      - series: 'portal_redis_failures_total{component="cache",operation="get",job="mct-api"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTRedisOperationFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              job: mct-api
              component: cache
              operation: get
            exp_annotations:
              summary: "Redis operations failing on mct-api (cache)"
              description: "Redis get operations for cache on mct-api fell back to a degraded path in the last 15 minutes (in-memory idempotency, memory cache, or a scan running without its lock). Check the redis container and the fallback logs; duplicate side effects and lost scan dedup become possible."

  # CASE 44: the worker-side fallback counter MUST fire the same rule (the `or`
  # right branch).
  - interval: 1m
    input_series:
      - series: 'worker_redis_failures_total{component="scan_lock",operation="claim",job="mct-worker"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTRedisOperationFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              job: mct-worker
              component: scan_lock
              operation: claim
            exp_annotations:
              summary: "Redis operations failing on mct-worker (scan_lock)"
              description: "Redis claim operations for scan_lock on mct-worker fell back to a degraded path in the last 15 minutes (in-memory idempotency, memory cache, or a scan running without its lock). Check the redis container and the fallback logs; duplicate side effects and lost scan dedup become possible."

  # CASE 45: no Redis fallbacks MUST stay quiet.
  - interval: 1m
    input_series:
      - series: 'portal_redis_failures_total{component="cache",operation="get",job="mct-api"}'
        values: '0+0x30'
      - series: 'worker_redis_failures_total{component="scan_lock",operation="claim",job="mct-worker"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MCTRedisOperationFailures
        exp_alerts: []
