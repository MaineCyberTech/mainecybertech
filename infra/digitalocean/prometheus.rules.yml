# Basic alerting rules for the MCT portal stack.
# NOTE: These rules are evaluated by Prometheus; for delivery (email/Slack/etc.)
# an Alertmanager deployment is required. The Watchdog rule below is a common
# liveness signal that fires once per day and is used to validate the alert path.
groups:
  - name: mct-service-availability
    rules:
      - alert: MCTServiceDown
        expr: up{job=~"mct-api|mct-worker"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MCT service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} (target {{ $labels.instance }}) for more than 2 minutes."

      - alert: MCTHighRequestErrorRate
        expr: |
          sum by (job) (
            rate(portal_http_requests_total{status_code=~"5.."}[5m])
            /
            clamp_min(rate(portal_http_requests_total[5m]), 0.0001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "MCT 5xx error rate above 5% ({{ $labels.job }})"
          description: "The 5xx error rate for {{ $labels.job }} has been above 5% for 5 minutes."

      # OBS-P2-009: SLO #2 in docs/SLO.md promises a page at p95 > 2s for 10m;
      # until now the latency objective was dashboard-only.
      - alert: MCTHighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(portal_http_request_duration_seconds_bucket[10m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "MCT API p95 latency above 2s"
          description: "API p95 request latency has been above 2 seconds for 10 minutes (SLO #2). Check the dashboard and recent deploys."

      # OBS-P2-009: an open circuit breaker fails calls fast; the Supabase
      # breaker guards the primary datastore, so this is user-impacting.
      - alert: MCTCircuitBreakerOpen
        expr: portal_circuit_breaker_status == 2
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is open"
          description: "Circuit breaker {{ $labels.name }} has been open for 5 minutes: calls through it are failing fast. Check the dependency health and recent error logs."

      # OBS-P2-009: auth failures are a golden signal for credential stuffing /
      # brute force and for a broken login path. Ratio AND an absolute floor so
      # a single typo at low volume cannot alert.
      - alert: MCTAuthFailureRateHigh
        expr: |
          (
            sum(rate(portal_auth_attempts_total{result="failure"}[10m]))
            /
            clamp_min(sum(rate(portal_auth_attempts_total[10m])), 0.0001)
            > 0.5
          )
          and
          (
            sum(rate(portal_auth_attempts_total{result="failure"}[10m])) > 0.05
          )
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "MCT authentication failure ratio above 50%"
          description: "More than half of authentication attempts have failed for 10 minutes (at least 3 failures/minute). This can be credential stuffing/brute force or a broken login path - review the auth logs."

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
          team: platform
        annotations:
          summary: "Prometheus Watchdog"
          description: "This alert is a liveness signal — firing at least once a day means the alerting pipeline is healthy."

  - name: mct-admin-abuse
    rules:
      # ADMIN-P1-002: platform-admin cross-tenant access is recorded to
      # impersonation_log and surfaced as portal_impersonation_events_total.
      # A sustained burst of cross-tenant entries warrants review. Delivery
      # requires Alertmanager (see the file header).
      - alert: MCTImpersonationBurst
        expr: sum(rate(portal_impersonation_events_total[10m])) > 0.5
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Elevated cross-tenant (impersonation) access volume"
          description: "More than 0.5 cross-tenant access events/second over 10 minutes. Review GET /api/v1/audit/impersonation."

      # IR-P2-002 / OBS-P2-005 / MT-P2-005: companion to MCTImpersonationBurst.
      # Impersonation is a privileged action and should be rare; this low-volume
      # rule surfaces a single event (the burst rule only catches sustained
      # volume). The metric carries no organization label, so a true first-seen
      # actor->org alert still needs a counter/label change.
      - alert: MCTImpersonationActivity
        expr: increase(portal_impersonation_events_total[15m]) > 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Cross-tenant (impersonation) access by {{ $labels.actor_role_key }} from {{ $labels.source }}"
          description: "A cross-tenant access event was recorded in the last 15 minutes (role {{ $labels.actor_role_key }}, source {{ $labels.source }}). Review GET /api/v1/audit/impersonation and confirm the access was expected."

      # IR-P1-006: runtime signal for tenant-isolation regressions.
      #
      # getScopedClient falls back to the RLS-bypassing service-role client for
      # any module not in the RLS allow-list - that is the normal state today,
      # so the bypass itself is not alertable. What IS alertable is a service-role
      # call that resolved NO organization: it means a query touched tenant data
      # with no tenant scope at all, which is the shape of a cross-tenant leak.
      #
      # IMPORTANT - why this is NOT keyed on org_resolved="false": cross-tenant
      # platform-admin requests (impersonation, the org switcher) legitimately
      # resolve no org, so a rule on that label fires continuously in normal
      # operation and becomes noise that hides a real regression.
      #
      # Different alert entirely: it must not depend on a self-referential
      # baseline (a sustained spike raises its own baseline and silences the
      # rule). Two independent conditions, both required:
      #
      #   (a) ABSOLUTE: the module is serving a high share of org-less
      #       service-role traffic right now (>= 50%). A module that is always
      #       org-less (a genuine platform-level read) is excluded by (b).
      # Design, corrected a second time. The first draft used clamp_min as if it
      # were a cap, pushing the threshold above 1.0 (dead rule). The second used
      # a self-referential 24h baseline, which INCLUDES the ongoing spike, so a
      # sustained regression raised its own baseline and silenced the rule
      # (reproduced with `promtool test rules`). Excluding "just the spike" from
      # a window is not expressible while the spike is ongoing.
      #
      # So this rule makes an ABSOLUTE assertion and does not try to learn a
      # baseline: a module serving >=50% of its RLS-bypassing traffic with NO
      # organization is the regression signature. That is deliberately biased
      # toward firing; the annotation tells the responder to distinguish a
      # genuine platform-level read path before acting, and MCTRlsEnforcedShare
      # Collapsed plus the org_resolved breakdown are the corroborating signals.
      #
      # Reachable by construction: the threshold is on the same 0..1 scale as the
      # measured ratio, so no arithmetic can push it out of range.
      - alert: MCTTenantScopeRegression
        expr: |
          (
            sum by (module) (rate(portal_rls_bypass_total{org_resolved="false"}[15m]))
            /
            clamp_min(sum by (module) (rate(portal_rls_bypass_total[15m])), 0.0001)
            >= 0.5
          )
          and on (module)
          (
            sum by (module) (rate(portal_rls_bypass_total[15m])) > 0.01
          )
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Module {{ $labels.module }} started serving tenant data with no organization scope"
          description: "At least half of the RLS-bypassing client selections for module {{ $labels.module }} resolve no organization. That is the signature of a tenant-isolation regression - a query that dropped its organization_id predicate. Confirm whether this module has a genuine platform-level read path before treating it as benign; check its queries for a missing organization_id filter."

      # IR-P1-006: RLS rollout visibility. Reports the enforced share as an
      # information-level signal ONLY when the RLS allow-lists are actually in
      # use somewhere. It is deliberately not an alert: with the allow-lists empty
      # by default the enforced share is legitimately ~0, and an alert on that
      # would fire permanently and mask real problems. Use the metric to watch
      # the rollout instead (Grafana / ad-hoc query).
      - alert: MCTRlsEnforcedShareCollapsed
        # Only meaningful once RLS is in use: fires when a module that HAS been
        # serving through the RLS client drops to zero enforced selections while
        # still serving traffic - i.e. it fell out of the allow-list.
        expr: |
          (
            sum by (module) (rate(portal_rls_enforced_total[30m])) == 0
          )
          and
          (
            sum by (module) (rate(portal_rls_bypass_total{module=~".+"}[30m])) > 0.05
          )
          and on (module)
          (
            max_over_time(sum by (module) (rate(portal_rls_enforced_total[5m]))[6h:5m]) > 0.01
          )
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Module {{ $labels.module }} stopped serving through the RLS-enforcing client"
          description: "Module {{ $labels.module }} previously served tenant queries through the RLS-enforcing client but has produced none for 30 minutes while still handling traffic. It likely dropped out of RLS_READS_ENABLED / RLS_WRITES_ENABLED. Check the allow-lists in the droplet .env."

  - name: mct-delivery-pipeline
    rules:
      # IR-P2-003 / OBS-P2-006 / WH-P2-010: the dead-letter counters exist on
      # both sides (API + worker) but nothing consumed them. Any accumulation is
      # alertable: a dead letter means a consumer permanently missed an event.
      - alert: MCTWebhookDeadLettersAccumulating
        expr: |
          increase(portal_webhook_dead_letters_total[1h]) > 0
          or
          increase(worker_webhook_dead_letters_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Webhook deliveries moved to the dead-letter set ({{ $labels.event }})"
          description: "One or more outbound webhook deliveries for event {{ $labels.event }} exhausted their retries in the last hour. Check the dead-letter store and replay once the receiver is healthy."

      # WH-P2-010: a sustained failure ratio above 50% is a delivery outage,
      # not a blip; critical so it reaches the on-call receiver.
      - alert: MCTWebhookDeliveryFailureRateHigh
        expr: |
          (
            sum by (job) (rate(portal_webhook_deliveries_total{status="failed"}[15m]))
            /
            clamp_min(sum by (job) (rate(portal_webhook_deliveries_total[15m])), 0.0001)
            > 0.5
          )
          or
          (
            sum by (job) (rate(worker_webhook_deliveries_total{status="failed"}[15m]))
            /
            clamp_min(sum by (job) (rate(worker_webhook_deliveries_total[15m])), 0.0001)
            > 0.5
          )
        for: 15m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Webhook delivery failure ratio above 50% ({{ $labels.job }})"
          description: "More than half of outbound webhook deliveries on {{ $labels.job }} have failed for 15 minutes. Consumers are missing events; check the delivery error logs and the receiver endpoints."

      # NOTIF-P1-003: delivery failures were metered but unalerted. SLO #4
      # (docs/SLO.md) is >= 99% success; 5% over 30m is the actionable version.
      # Skipped deliveries are excluded from the denominator because in_app
      # skips are dedup hits, not failures.
      - alert: MCTNotificationDeliveryFailureRateHigh
        expr: |
          (
            sum by (channel, job) (rate(portal_notification_delivery_total{status="failed"}[30m]))
            /
            clamp_min(
              sum by (channel, job) (rate(portal_notification_delivery_total{status=~"success|failed"}[30m])),
              0.0001
            )
            > 0.05
          )
          or
          (
            sum by (channel, job) (rate(worker_notification_delivery_total{status="failed"}[30m]))
            /
            clamp_min(
              sum by (channel, job) (rate(worker_notification_delivery_total{status=~"success|failed"}[30m])),
              0.0001
            )
            > 0.05
          )
        for: 30m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Notification delivery failures above 5% ({{ $labels.channel }})"
          description: "More than 5% of {{ $labels.channel }} deliveries on {{ $labels.job }} have failed for 30 minutes. Check SMTP/provider errors; recipients are not being notified."

      # NOTIF-P1-003: a skipped email means SMTP is not configured. The senders
      # meter it, but nothing alerts, so email notifications silently stop.
      - alert: MCTNotificationEmailSkipped
        expr: |
          increase(portal_notification_delivery_total{channel="email",status="skipped"}[1h]) > 0
          or
          increase(worker_notification_delivery_total{channel="email",status="skipped"}[1h]) > 0
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Notification emails are being skipped"
          description: "At least one email delivery was skipped in the last hour because SMTP is not configured. Recipients are silently not receiving email notifications - check the SMTP_* environment."

  - name: mct-worker-health
    rules:
      # OBS-P2-009 / CHAIN-P2-010: any non-success worker execution is a lost
      # job; no_handler means the queue delivered a task type this build has no
      # handler for.
      - alert: MCTWorkerTaskFailures
        expr: sum by (task_type) (rate(worker_task_executions_total{status=~"failure|error|no_handler"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Worker task {{ $labels.task_type }} is failing"
          description: "Task type {{ $labels.task_type }} has recorded failure/error/no_handler executions for 10 minutes. Check the worker logs for {{ $labels.task_type }}."

      # OBS-P2-009: backlog signal. Deliberately NOT keyed on the
      # queue="unavailable" series: the worker sets that gauge to 0 and never
      # clears it (and it is also set when the queue is disabled by config), so
      # its presence is not an alertable condition.
      - alert: MCTWorkerQueueBacklog
        expr: worker_task_queue_depth{queue="mct-tasks"} > 50
        for: 15m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Worker task queue backlog above 50"
          description: "More than 50 tasks have been waiting/active in the BullMQ queue for 15 minutes. Tasks are not draining - check worker health, Redis latency and the failing task types."

  # BILL-P2-003: nightly Stripe reconciliation drift.
  #
  # The worker's `stripe-reconcile` task compares the local billing mirror
  # against Stripe (the source of truth), writes the fetched subscription state
  # back, and fails the run (`ok:false`) when it finds drift or per-item
  # errors. A failed run is already covered by MCTWorkerTaskFailures (above);
  # this rule surfaces the drift itself, per kind, so a mirror that disagrees
  # with Stripe is visible even while the next run repairs it. The 25h window
  # covers the daily schedule: it fires when the most recent run produced
  # drift and resolves once a clean run replaces it.
  - name: mct-billing-reconcile
    rules:
      - alert: MCTStripeReconcileDrift
        expr: increase(worker_stripe_reconcile_drift_total[25h]) > 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Stripe reconciliation detected billing drift"
          description: "The stripe-reconcile task found at least one mirror-vs-Stripe mismatch in the last 25 hours (subscription status, invoice count/sum, or payment count/sum). Check the worker logs for the organization and drift kind, then compare the local billing mirror with Stripe."


  # RES-P2-008: worker queue connectivity. The worker exports
  # worker_queue_connected (1 while both its BullMQ producer Queue and consumer
  # Worker hold a ready Redis connection, 0 when either is lost). In the same
  # disconnected state the worker /health probe returns 503, so a lost queue
  # also fails the compose healthcheck and the deploy gate. This complements
  # MCTWorkerQueueBacklog above: a disconnected queue freezes the depth gauge
  # (or moves it to queue="unavailable"), which the backlog rule cannot see.
  # Delivery requires Alertmanager (see the file header).
  - name: mct-worker-queue
    rules:
      - alert: MCTWorkerQueueDisconnected
        expr: worker_queue_connected == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "MCT worker lost its BullMQ (Redis) queue connection"
          description: "worker_queue_connected has been 0 for 5 minutes: the worker cannot consume queued tasks, and scheduled tasks fall back to direct execution. Check Redis (docker compose ps redis) and the worker logs; the worker container also reports unhealthy on /health."

      # RES-P2-008 / IR-P1-003: backlog GROWTH, complementing the absolute
      # MCTWorkerQueueBacklog rule (OBS-P2-009). A backlog that is climbing on
      # top of a non-trivial base means arrivals outpace the consumer well
      # before the absolute threshold is reached. The queue="unavailable"
      # series (the disconnected shape) is deliberately not matched here.
      - alert: MCTWorkerQueueBacklogGrowing
        expr: |
          worker_task_queue_depth{queue="mct-tasks"} > 20
          and
          delta(worker_task_queue_depth{queue="mct-tasks"}[10m]) > 25
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "MCT worker task queue backlog is growing"
          description: "worker_task_queue_depth for mct-tasks is above 20 and has grown by more than 25 jobs over 10 minutes, sustained for 10 minutes. Arrivals are outpacing the consumer - check the worker logs, Redis latency and worker concurrency."
