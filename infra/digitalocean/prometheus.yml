# Prometheus configuration for the MCT portal stack.
# Runs inside the docker compose network — NO public exposure (no published ports).
# Scrapes the API and Worker /metrics endpoints.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Forward firing alerts to Alertmanager (IR-P0-003). Internal-only, on the
# compose network — no published ports. Alertmanager then routes the `Watchdog`
# alert to an external dead-man's-switch receiver (see alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: mct-api
    metrics_path: /metrics
    # The API gates /metrics behind METRICS_TOKEN and returns 404 when the
    # bearer token is missing, so an unauthenticated scrape reports the target
    # down and the MCTServiceDown rule fires on a healthy API. The deploy
    # writes the token to this file (0600) and compose mounts it read-only.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:4000"]
        labels:
          service: api

  - job_name: mct-worker
    metrics_path: /metrics
    # ARCH-P3-005: the worker /metrics endpoint is gated with the same
    # METRICS_TOKEN as the API (404 without it), so the scrape must present the
    # bearer token written by the deploy and mounted read-only.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["worker:3001"]
        labels:
          service: worker

  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
